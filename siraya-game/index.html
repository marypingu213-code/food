<title>西拉雅建築探險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：觸控電視用的單一畫面；深綠工具列呼應展板的深綠帶，圖片直接取自館內展板。刻意採單一亮色主題。 */
:root {
  --paper: #eef1ef;
  --card: #ffffff;
  --ink: #1f2a2a;
  --muted: #5a6664;
  --band: #1f4a3e;
  --red: #e8452c;
  --blue: #2f5aa8;
  --mango: #f4b223;
  --ok: #2e8b57;
  --line: #c5d0cd;
  --display: "Huninn", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 5px solid var(--mango); outline-offset: 4px; }
#app { height: 100%; display: flex; flex-direction: column; }
header { background: var(--band); color: #fff; display: flex; align-items: center; gap: clamp(8px, 1vw, 18px); padding-block: clamp(6px, 1vh, 14px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
header h1 { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 2.2vw, 42px); margin: 0; letter-spacing: .04em; flex: 1; min-width: 0; }
.tbtn { background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); border-radius: 999px; color: #fff; padding: .3em .9em; font-size: clamp(14px, 1.2vw, 24px); font-weight: 700; white-space: nowrap; }
.tbtn[aria-pressed="true"] { background: var(--mango); color: var(--ink); border-color: var(--mango); }
.stars { font-size: clamp(18px, 1.7vw, 32px); letter-spacing: .1em; color: var(--mango); white-space: nowrap; }
main { flex: 1; min-height: 0; position: relative; padding-block: clamp(10px, 1.8vh, 26px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 22px); }
.prompt { display: flex; align-items: center; gap: .45em; font-family: var(--display); font-size: clamp(22px, 3vw, 58px); line-height: 1.25; text-wrap: balance; }
.prompt .say { flex: none; width: 1.5em; height: 1.5em; border-radius: 50%; border: 0; background: var(--blue); color: #fff; font-size: .7em; display: grid; place-items: center; }
.prompt .count { margin-left: auto; font-family: var(--body); font-size: .5em; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.next { background: var(--red); color: #fff; border: 0; border-radius: 999px; padding: .35em 1.3em; font-family: var(--display); font-size: clamp(20px, 2.3vw, 46px); box-shadow: 0 6px 0 rgba(0,0,0,.18); }
.next.alt { background: var(--blue); }
.next.ghost { background: var(--card); color: var(--ink); border: 3px solid var(--line); box-shadow: none; }
.bar { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
.tip { font-size: clamp(14px, 1.3vw, 24px); color: var(--muted); text-align: center; }

/* 首頁 */
.home { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: clamp(12px, 1.8vw, 28px); align-content: center; }
.gcard { background: var(--card); border: 0; border-radius: 24px; overflow: hidden; box-shadow: 0 6px 0 rgba(31,74,62,.18); display: flex; flex-direction: column; text-align: left; padding: 0; transition: transform .15s; }
.gcard:active { transform: scale(.98); }
.gcard .ph { aspect-ratio: 16 / 10; background: var(--paper) center / cover no-repeat; position: relative; }
.gcard .lv { position: absolute; left: 12px; top: 12px; background: var(--band); color: #fff; border-radius: 999px; padding: .15em .7em; font-size: clamp(12px, 1vw, 20px); font-weight: 700; }
.gcard .tx { padding: clamp(10px, 1.2vw, 22px); display: flex; flex-direction: column; gap: .2em; }
.gcard .nm { font-family: var(--display); font-size: clamp(22px, 2.3vw, 46px); display: flex; justify-content: space-between; align-items: baseline; gap: .3em; }
.gcard .st { color: var(--mango); }
.gcard .ds { font-size: clamp(14px, 1.15vw, 22px); color: var(--muted); line-height: 1.45; }

/* 選項設定 */
.setup { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: clamp(14px, 3vh, 40px); }
.setup .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
.setup .lb { font-size: clamp(18px, 1.8vw, 34px); font-weight: 700; min-width: 5em; text-align: right; }
.chip { background: var(--card); border: 4px solid var(--line); border-radius: 18px; padding: .35em 1em; font-size: clamp(18px, 1.8vw, 34px); font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--red); background: #fdeae6; }

/* 路線配對 */
.route { flex: 1; min-height: 0; display: grid; grid-template-rows: auto 1fr; gap: clamp(8px, 1.6vh, 20px); }
.bins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 24px); }
.bin { background: var(--card); border: 5px solid var(--line); border-radius: 22px; padding: 0; overflow: hidden; display: flex; flex-direction: column; text-align: left; }
.bin .ph { height: clamp(70px, 17vh, 230px); background: center / cover no-repeat; }
.bin .tx { padding: .3em .6em .5em; display: flex; flex-direction: column; gap: .2em; min-height: 0; }
.bin .nm { font-family: var(--display); font-size: clamp(20px, 2.4vw, 48px); line-height: 1.1; }
.bin .en { font-size: clamp(11px, .9vw, 18px); color: var(--muted); letter-spacing: .04em; }
.bin .got { display: flex; flex-wrap: wrap; gap: 4px; }
.bin .got img { width: clamp(34px, 4.4vw, 84px); aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; }
.bin.over { border-color: var(--blue); }
.bin.hint { border-color: var(--red); animation: pulseb 1s ease-in-out infinite; }
@keyframes pulseb { 50% { background: #fde3dd; } }
.deck { display: flex; align-items: center; justify-content: center; min-height: 0; }
.item { background: var(--card); border-radius: 22px; box-shadow: 0 8px 0 rgba(31,74,62,.2); padding: clamp(8px, 1vw, 16px); display: flex; flex-direction: column; align-items: center; gap: .2em; touch-action: none; width: clamp(200px, 30vw, 520px); cursor: grab; }
.item img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; pointer-events: none; }
.item .nm { font-family: var(--display); font-size: clamp(22px, 2.6vw, 52px); text-align: center; pointer-events: none; padding: .4em 0; }
.item.textonly { padding: clamp(18px, 3vh, 40px) clamp(16px, 2vw, 32px); }
.item.drag { position: fixed; z-index: 50; cursor: grabbing; box-shadow: 0 16px 30px rgba(0,0,0,.25); }
.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }

/* 線索猜景點 */
.clue { background: var(--card); border-left: 10px solid var(--mango); border-radius: 0 18px 18px 0; padding: .5em .9em; font-size: clamp(22px, 2.6vw, 52px); font-family: var(--display); line-height: 1.35; }
.opts { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 24px); align-content: center; }
.opt { background: var(--card); border: 5px solid transparent; border-radius: 20px; padding: clamp(6px, .7vw, 12px); display: flex; flex-direction: column; gap: .3em; box-shadow: 0 6px 0 rgba(31,74,62,.15); }
.opt img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; }
.opt .nm { font-size: clamp(16px, 1.7vw, 32px); font-weight: 700; text-align: center; }
.opt.right { border-color: var(--ok); }
.opt.dim { opacity: .3; }
.reveal { font-size: clamp(16px, 1.6vw, 30px); color: var(--band); font-weight: 700; text-align: center; min-height: 1.5em; }

/* 建築師的祕密 */
.pairs { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(12px, 3vw, 60px); position: relative; }
.col { display: flex; flex-direction: column; gap: clamp(6px, 1vh, 14px); justify-content: center; min-height: 0; }
.pc { background: var(--card); border: 4px solid var(--line); border-radius: 16px; padding: .45em .7em; font-size: clamp(15px, 1.55vw, 30px); line-height: 1.35; text-align: left; display: flex; gap: .5em; align-items: center; }
.pc .tag { flex: none; width: 1.8em; height: 1.8em; border-radius: 50%; display: grid; place-items: center; background: var(--paper); font-weight: 900; font-size: .85em; }
.pc.sel { border-color: var(--blue); background: #e6edf9; }
.pc.done { border-color: var(--ok); background: #e5f3ea; }
.pc.done .tag { background: var(--ok); color: #fff; }
.pc.hint { border-color: var(--red); animation: pulseb 1s ease-in-out infinite; }

.sq { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(12px, 2.4vw, 44px); align-items: center; }
.sqfig { margin: 0; display: flex; flex-direction: column; gap: .4em; min-height: 0; }
.sqfig .ph { position: relative; }
.sqfig img { width: 100%; max-height: calc(100vh - 300px); object-fit: contain; border-radius: 18px; background: var(--card); display: block; }
.sqfig .kind { position: absolute; left: 12px; top: 12px; background: var(--band); color: #fff; border-radius: 999px; padding: .1em .7em; font-size: clamp(12px, 1vw, 20px); font-weight: 700; }
.sqfig figcaption { font-family: var(--display); font-size: clamp(22px, 2.6vw, 52px); text-align: center; }
.sqopts { display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 20px); }
.sqopts .pc { font-size: clamp(18px, 2vw, 40px); padding: .6em .8em; }
.pc.dimmed { opacity: .3; }
.fact { background: #fff6dc; border-left: 8px solid var(--mango); border-radius: 0 14px 14px 0; padding: .5em .8em; font-size: clamp(16px, 1.6vw, 30px); line-height: 1.45; }
.col { overflow: auto; justify-content: safe center; }
.col.photos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-content: safe center; }
.col.photos .pc { padding: .3em; flex-direction: column; align-items: stretch; gap: .2em; position: relative; font-size: clamp(13px, 1.25vw, 24px); text-align: center; }
.col.photos .pc img { width: 100%; height: clamp(50px, 11vh, 150px); object-fit: cover; border-radius: 10px; }
.col.photos .pc .tag { position: absolute; right: 8px; top: 8px; }
.sq { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
@media (max-width: 700px) { .sq { grid-template-columns: 1fr; } }
/* 找一找（實景照片） */
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
.photo { position: relative; max-width: 100%; max-height: 100%; touch-action: none; }
.photo img { display: block; max-width: 100%; max-height: calc(100vh - 260px); border-radius: 16px; pointer-events: none; }
.edit img { max-height: calc(100vh - 360px); }
.box { position: absolute; border: 5px dashed transparent; border-radius: 12px; }
.edit .box { border-color: var(--mango); background: rgba(244,178,35,.18); }
.edit .box span { position: absolute; left: 0; top: 0; transform: translateY(-110%); background: var(--mango); padding: 2px 10px; border-radius: 8px; font-weight: 700; font-size: clamp(13px, 1.1vw, 20px); white-space: nowrap; }
.box.hint { border-color: var(--red); animation: pulseb 1s ease-in-out infinite; }
.box.found { border: 6px solid var(--mango); box-shadow: 0 0 0 6px rgba(244,178,35,.4); }
.box.drawing { border-color: var(--blue); }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.empty h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 3vw, 56px); margin: 0; }
.empty ol { text-align: left; font-size: clamp(16px, 1.5vw, 28px); line-height: 1.7; margin: 0; max-width: 34em; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
.tools .chip { font-size: clamp(14px, 1.3vw, 24px); border-width: 3px; }
.tools input[type=text] { font: inherit; font-size: clamp(14px, 1.3vw, 24px); padding: .3em .6em; border: 3px solid var(--line); border-radius: 14px; width: 9em; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.thumbs button { border: 4px solid transparent; border-radius: 10px; padding: 0; overflow: hidden; background: none; position: relative; }
.thumbs button[aria-pressed="true"] { border-color: var(--red); }
.thumbs img { height: 54px; display: block; }

/* 回饋與證書 */
.toast { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; background: var(--ok); color: #fff; font-family: var(--display); font-size: clamp(32px, 5vw, 100px); padding: .2em .8em; border-radius: 999px; transition: .25s; z-index: 60; white-space: nowrap; }
.toast.try { background: var(--blue); }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.cert { flex: 1; min-height: 0; background: var(--card); border: 12px double var(--red); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4em; text-align: center; padding: 16px; }
.cert h2 { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 5.5vw, 110px); margin: 0; color: var(--band); }
.cert p { font-size: clamp(18px, 2vw, 40px); margin: 0; }
.cert .big { font-size: clamp(36px, 4.5vw, 90px); color: var(--mango); letter-spacing: .1em; }
@media (max-width: 700px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pairs { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <header>
    <h1>西拉雅建築探險</h1>
    <span class="stars" id="stars" aria-label="星星"></span>
    <button class="tbtn" id="bHome">首頁</button>
    <button class="tbtn" id="bEasy" aria-pressed="false">提示快一點</button>
    <button class="tbtn" id="bSound" aria-pressed="true">聲音 開</button>
    <button class="tbtn" id="bFull">全螢幕</button>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- 資料：三大主軸與 24 個景點（取自館內常設展展板） ----------
const ROUTES = [
  { k: "canal", nm: "水圳之源", en: "Source of water canal", sub: "官田・六甲・烏山頭・八田與一" },
  { k: "hill", nm: "湖丘時光", en: "Hills & Lake in Time", sub: "南化・左鎮・玉井・新化・虎頭埤" },
  { k: "cloud", nm: "雲水之間", en: "Between Clouds and Water", sub: "中埔・大埔・曾文水庫・楠西" },
];
const SPOTS = [
  ["canal", 1, "官田遊客中心", "我們今天戶外教學來的地方，屋頂上長了草"],
  ["canal", 2, "六甲落羽松森林", "一整排高高的樹倒映在水面上，秋冬葉子會變紅"],
  ["canal", 3, "南元花園休閒農場", null],
  ["canal", 4, "尖山埤江南渡假村", "湖邊的渡假村，可以坐船遊湖"],

  ["hill", 1, "南化遊客中心", null],
  ["hill", 2, "大坑休閒農場", null],
  ["hill", 3, "左鎮化石園區", "可以看到很久很久以前動物的骨頭化石"],

// 建築師的祕密：設計 ↔ 用意（依建築師設計概念導覽）
const SECRETS = [
  ["停車場屋頂上種滿植物（覆土建築）", "停車場藏在下面，上面變成綠地，比較涼", "img/s1.jpg", "官田遊客中心是覆土式綠建築，2022 年得到園冶獎"],

  ["房子圍著廣場、面向草地和水池", "像西拉雅聚落面向水、在戶外聚會", "img/s6.jpg", "園區融合台南的陽光、嘉南平原的風、阿立祖的水"],
  ["白牆上的藍色線條、紅色窗框", "西拉雅傳統服飾的顏色", "img/s7.jpg", "西拉雅傳統服飾以藍、白、紅、黑為主"],

// ---------- 聲音與回饋 ----------
let actx;
function chime(ok) {
  if (!state.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    (ok ? [523, 659, 784] : [392, 330]).forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.12;
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.4);
    });
  } catch (e) {}
}
function speak(text) {
  if (!state.sound) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[「」（）]/g, " "));
    u.lang = "zh-TW"; u.rate = 0.85;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
let toastT;
function toast(text, ok = true, say = text) {
  const t = $("#toast");
  t.textContent = text; t.className = "toast show" + (ok ? "" : " try");
  clearTimeout(toastT); toastT = setTimeout(() => t.className = "toast", 1200);
  chime(ok); speak(say);
}
function promptEl(text, spoken, count) {
  const d = document.createElement("div"); d.className = "prompt";
  d.innerHTML = `<button class="say" aria-label="再聽一次">▶</button><span>${text}</span>${count ? `<span class="count">${count}</span>` : ""}`;
  d.querySelector(".say").onclick = () => speak(spoken || text);
  return d;
}
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hintAfter = () => state.easy ? 1 : 2;
const routeOf = k => ROUTES.find(r => r.k === k);
function screen() { main.innerHTML = ""; const s = el("div", "screen"); main.append(s); return s; }
function renderStars() { const n = Object.values(state.done).filter(Boolean).length; $("#stars").textContent = "★".repeat(n) + "☆".repeat(4 - n); }

function finish(key, summary) {

// ---------- 遊戲一：三大主軸配對 ----------
function routeSetup() {
  setupScreen("三大主軸配對", "把景點放進對的路線。先選擇玩法", [
    { label: "卡片", key: "mode", value: "pic", options: [["pic", "圖片＋名字"], ["name", "只有名字"]] },
    { label: "數量", key: "n", value: 12, options: [[6, "6 張"], [12, "12 張"], [24, "全部 24 張"]] },
  ], v => routeGame(v));
}
function routeGame({ mode, n }) {
  const per = n / 3;
  const qs = shuffle(ROUTES.flatMap(r => shuffle(SPOTS.filter(x => x.r === r.k)).slice(0, per)));
  let i = 0, wrong = 0, lock = false, miss = 0, card;
  const s = screen();
  const p = el("div"); s.append(p);
  const r = el("div", "route");
  const bins = el("div", "bins");
  ROUTES.forEach(rt => {
    const b = el("button", "bin", `<div class="ph" style="background-image:url('img/hero-${rt.k}.jpg')"></div><div class="tx"><span class="nm">${rt.nm}</span><span class="en">${rt.en}</span><span class="got"></span></div>`);
    b.dataset.k = rt.k; b.onclick = () => drop(b); bins.append(b);
  });
  const deck = el("div", "deck");
  r.append(bins, deck); s.append(r, el("div", "tip", "把卡片拖到對的路線，或直接點路線"));
  function ask() {
    wrong = 0; lock = false;
    bins.querySelectorAll(".bin").forEach(b => b.classList.remove("hint"));
    const it = qs[i];
    p.replaceChildren(promptEl(`「${it.nm}」屬於哪一條路線？`, `${it.nm}，屬於哪一條路線？`, `${i + 1} / ${qs.length}`));
    card = el("div", "item" + (mode === "name" ? " textonly" : ""), (mode === "pic" ? `<img src="${it.img}" alt="">` : "") + `<span class="nm">${it.nm}</span>`);
    deck.replaceChildren(card); makeDrag(card);
    speak(`${it.nm}，屬於哪一條路線？`);
  }
  function drop(b) {
    if (lock || !b) return;
    const it = qs[i];
    if (b.dataset.k === it.r) {
      lock = true;
      b.querySelector(".got").append(Object.assign(document.createElement("img"), { src: it.img, alt: it.nm }));
      card.remove(); toast(`答對了！${routeOf(it.r).nm}`);
      setTimeout(() => { i++; i < qs.length ? ask() : finish("route", `${qs.length} 個景點，答錯 ${miss} 次`); }, 1400);
    } else {
      wrong++; miss++; resetCard(); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      toast("再想想看", false);
      if (wrong >= hintAfter()) bins.querySelector(`.bin[data-k="${it.r}"]`).classList.add("hint");
    }
  }
  function resetCard() { card.classList.remove("drag"); card.style.left = card.style.top = card.style.width = ""; }
  function binAt(x, y) { return [...bins.children].find(b => { const q = b.getBoundingClientRect(); return x >= q.left && x <= q.right && y >= q.top && y <= q.bottom; }); }
  function makeDrag(c) {
    c.addEventListener("pointerdown", e => {
      if (lock) return;
      const q = c.getBoundingClientRect(), ox = e.clientX - q.left, oy = e.clientY - q.top; let moved = false;
      c.setPointerCapture(e.pointerId);
      c.onpointermove = ev => {
        if (!moved && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < 8) return;
        if (!moved) { c.style.width = q.width + "px"; c.classList.add("drag"); }
        moved = true; c.style.left = ev.clientX - ox + "px"; c.style.top = ev.clientY - oy + "px";
        const u = binAt(ev.clientX, ev.clientY); [...bins.children].forEach(b => b.classList.toggle("over", b === u));
      };
      c.onpointerup = ev => {
        c.onpointermove = c.onpointerup = null; [...bins.children].forEach(b => b.classList.remove("over"));
        if (!moved) return;
        const u = binAt(ev.clientX, ev.clientY); u ? drop(u) : resetCard();
      };
    });
  }
  ask();
}

// ---------- 遊戲二：聽線索猜景點 ----------
function clueSetup() {
  setupScreen("聽線索猜景點", "聽線索，找出是哪個景點。先選擇玩法", [
    { label: "選項", key: "names", value: true, options: [[true, "圖片＋名字"], [false, "只有圖片"]] },
    { label: "題數", key: "n", value: 8, options: [[5, "5 題"], [8, "8 題"], [17, "全部 17 題"]] },
    { label: "加碼", key: "route", value: false, options: [[false, "只猜景點"], [true, "再猜路線"]] },
  ], v => clueGame(v));
}
function clueGame({ names, n, route }) {
  const pool = SPOTS.filter(x => x.clue);
  const qs = shuffle(pool).slice(0, n);
  let i = 0, wrong = 0, lock = false, miss = 0;
  const s = screen();
  const p = el("div"), clue = el("div", "clue"), opts = el("div", "opts"), rev = el("div", "reveal");
  s.append(p, clue, opts, rev);
  function ask() {
    wrong = 0; lock = false; rev.textContent = "";
    const it = qs[i];
    p.replaceChildren(promptEl("這是哪一個景點？", `線索：${it.clue}。這是哪一個景點？`, `${i + 1} / ${qs.length}`));
    clue.textContent = `線索：${it.clue}`;
    const others = shuffle(SPOTS.filter(x => x !== it)).slice(0, 3);
    opts.replaceChildren(...shuffle([it, ...others]).map(o => {
      const b = el("button", "opt", `<img src="${o.img}" alt="${names ? "" : o.nm}">${names ? `<span class="nm">${o.nm}</span>` : ""}`);
      b.onclick = () => pick(b, o); return b;
    }));
    speak(`線索：${it.clue}。這是哪一個景點？`);
  }
  function pick(b, o) {
    if (lock) return;
    const it = qs[i];
    if (o === it) {
      lock = true; b.classList.add("right");
      opts.querySelectorAll(".opt").forEach(x => x !== b && x.classList.add("dim"));
      if (route) return askRoute(it);
      rev.textContent = `${it.nm}　屬於「${routeOf(it.r).nm}」`;
      toast("答對了！", true, `答對了，是${it.nm}，屬於${routeOf(it.r).nm}`);
      setTimeout(nextQ, 2600);
    } else {
      wrong++; miss++; b.classList.add("dim"); toast("再想想看", false);
      if (wrong >= hintAfter() + 1) opts.querySelectorAll(".opt").forEach(x => { if (!x.classList.contains("dim") && x !== b && Math.random() < .5 && x.querySelector("img").getAttribute("src") !== it.img) x.classList.add("dim"); });
    }
  }
  function askRoute(it) {
    rev.replaceChildren();
    toast("答對了！", true, `答對了，是${it.nm}。它屬於哪一條路線？`);
    const row = el("div", "bar");
    ROUTES.forEach(rt => {
      const b = el("button", "next ghost", rt.nm);
      b.onclick = () => {
        if (rt.k === it.r) { row.querySelectorAll("button").forEach(x => x.disabled = true); b.style.borderColor = "var(--ok)"; toast(`${rt.nm}，答對了！`); setTimeout(nextQ, 1800); }
        else { miss++; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); toast("再想想看", false); }
      };
      row.append(b);
    });
    rev.append(row);
  }
  function nextQ() { i++; i < qs.length ? ask() : finish("clue", `${qs.length} 題，答錯 ${miss} 次`); }
  ask();
}

// ---------- 遊戲三：建築師的祕密 ----------
function secretSetup() {
  setupScreen("建築師的祕密", "看照片，想一想建築為什麼這樣蓋。先選擇玩法", [
    { label: "玩法", key: "mode", value: "quiz", options: [["quiz", "一題一題"], ["pair", "全部配對"]] },
    { label: "題數", key: "n", value: 5, options: [[3, "3 題"], [5, "5 題"], [8, "8 題"], [11, "全部 11 題"]] },
    { label: "選項", key: "k", value: 3, options: [[2, "2 個"], [3, "3 個"], [4, "4 個"]] },
  ], v => v.mode === "quiz" ? secretQuiz(v) : secretPair(v));
}
function secretQuiz({ n, k }) {
  const qs = shuffle(SECRETS).slice(0, n);
  let i = 0, wrong = 0, lock = false, miss = 0;
  const s = screen();
  const p = el("div"), body = el("div", "sq"); s.append(p, body);
  function ask() {
    wrong = 0; lock = false;
    const it = qs[i];
    p.replaceChildren(promptEl(`建築師為什麼要這樣設計？`, `${it.a}。建築師為什麼要這樣設計？`, `${i + 1} / ${qs.length}`));
    const fig = el("figure", "sqfig", `<div class="ph"><img src="${it.img}" alt="${it.a}"><span class="kind">${it.kind}</span></div><figcaption>${it.a}</figcaption>`);
    const col = el("div", "sqopts");
    const opts = shuffle([it, ...shuffle(SECRETS.filter(x => x !== it)).slice(0, k - 1)]);
    opts.forEach(o => {
      const b = el("button", "pc", `<span class="tag">?</span><span>${o.b}</span>`);
      b.onclick = () => {
        if (lock || b.classList.contains("dimmed")) return;
        if (o === it) {
          lock = true; b.classList.add("done"); b.querySelector(".tag").textContent = "✓";
          col.querySelectorAll(".pc").forEach(x => x !== b && x.classList.add("dimmed"));
          toast("答對了！", true, `答對了。${it.b}。${it.fact}`);
          col.append(el("div", "fact", `小知識：${it.fact}`));
          setTimeout(() => { i++; i < qs.length ? ask() : finish("secret", `${qs.length} 個設計，答錯 ${miss} 次`); }, 5200);
        } else {
          wrong++; miss++; b.classList.add("dimmed"); toast("再想想看", false);
          if (wrong >= hintAfter()) [...col.children].find(x => x.dataset.ok)?.classList.add("hint");
        }
      };
      if (o === it) b.dataset.ok = 1;
      col.append(b);
    });
    body.replaceChildren(fig, col);
    speak(`${it.a}。建築師為什麼要這樣設計？`);
  }
  ask();
}
function secretPair({ n }) {
  const set = shuffle(SECRETS).slice(0, Math.min(n, 8)).map((x, i) => ({ ...x, id: i }));
  n = set.length;
  let sel = null, matched = 0, miss = 0, wrong = 0;
  const s = screen();
  s.append(promptEl("先點左邊的照片，再點右邊的用意", "先點左邊的照片，再點右邊它的用意", `0 / ${n}`));
  const pairs = el("div", "pairs"), L = el("div", "col photos"), R = el("div", "col");
  pairs.append(L, R); s.append(pairs);
  const count = () => s.querySelector(".count").textContent = `${matched} / ${n}`;
  set.forEach(x => {
    const b = el("button", "pc", `<img src="${x.img}" alt=""><span>${x.a}</span><span class="tag">?</span>`); b.dataset.id = x.id;
    b.onclick = () => { if (b.classList.contains("done")) return; L.querySelectorAll(".pc").forEach(y => y.classList.remove("sel")); b.classList.add("sel"); sel = x; wrong = 0; R.querySelectorAll(".pc").forEach(y => y.classList.remove("hint")); speak(x.a); };
    L.append(b);
  });
  shuffle(set).forEach(x => {
    const b = el("button", "pc", `<span class="tag">?</span><span>${x.b}</span>`); b.dataset.id = x.id;
    b.onclick = () => {
      if (b.classList.contains("done")) return;
      if (!sel) { toast("先點左邊的照片", false); return; }
      if (sel.id === x.id) {
        matched++; const no = matched;
        [L.querySelector(`[data-id="${x.id}"]`), b].forEach(y => { y.classList.remove("sel", "hint"); y.classList.add("done"); y.querySelector(".tag").textContent = no; });
        toast("配對成功！", true, `${sel.a}，${x.b}`); sel = null; count();
        if (matched === n) setTimeout(() => finish("secret", `${n} 組設計，答錯 ${miss} 次`), 2600);
      } else {
        wrong++; miss++; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); toast("再想想看", false);
        if (wrong >= hintAfter()) R.querySelector(`[data-id="${sel.id}"]`).classList.add("hint");
      }
    };
    R.append(b);
  });
  speak("先點左邊的照片，再點右邊它的用意");
}

const DB = {
  mem: [],
  open() { return new Promise((res, rej) => { try { const r = indexedDB.open("siraya-find", 1); r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath: "id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async all() { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction("photos").objectStore("photos").getAll(); q.onsuccess = () => res(q.result.sort((a, b) => a.id - b.id)); q.onerror = () => res(this.mem); }); } catch (e) { return this.mem; } },
  async put(p) { const i = this.mem.findIndex(x => x.id === p.id); i < 0 ? this.mem.push(p) : this.mem[i] = p; try { const db = await this.open(); db.transaction("photos", "readwrite").objectStore("photos").put(p); } catch (e) {} },
  async del(id) { this.mem = this.mem.filter(x => x.id !== id); try { const db = await this.open(); db.transaction("photos", "readwrite").objectStore("photos").delete(id); } catch (e) {} },
};
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .82)); };
    img.onerror = rej; img.src = url;
  });
}
async function findHome() {
  const photos = [...FIND_PRESETS, ...(await DB.all())];
  const targets = photos.flatMap(p => [...new Set(p.boxes.map(b => b.label))].map(label => ({ p, label, rects: p.boxes.filter(b => b.label === label) })));
  const s = screen();
  s.append(promptEl("實景找一找", "用遊客中心的照片，找出建築的設計"));
  if (!targets.length) {
    s.append(el("div", "empty", `<h2>還沒有照片</h2><ol><li>按「老師設定」，加入遊客中心的照片（事前勘查或網路上的官方照片）。</li><li>選一個題目，例如「入口的三個壺」，在照片上拖曳框出答案的位置。</li><li>回到這裡按「開始」，學生點照片找答案。</li></ol><p class="tip">照片只存在這台電腦的瀏覽器裡，不會上傳。</p>`));
  } else {
    s.append(el("div", "empty", `<h2>${photos.length} 張照片、${targets.length} 個題目</h2><p class="tip">內建 ${FIND_PRESETS.length} 張遊客中心照片；老師可以按「老師設定」加入自己拍的照片。<br>學生點照片上的位置找答案，答錯 ${hintAfter()} 次會閃爍提示。</p>`));
  }
  const bar = el("div", "bar");
  if (targets.length) { [6, 12].forEach(k => { const g = el("button", "next", `開始（${k} 題）`); g.onclick = () => findGame(shuffle(targets).slice(0, k)); bar.append(g); }); }
  const t = el("button", "next alt", "老師設定"); t.onclick = () => findEdit(0); bar.append(t);
  s.append(bar);
}
async function findEdit(idx) {
  let photos = await DB.all();
  const s = screen();
  s.append(promptEl("老師設定：先選題目，再在照片上拖曳框出答案", "老師設定"));
  const tools = el("div", "tools");
  const up = el("label", "chip", `加入照片<input type="file" id="findUpload" accept="image/*" multiple hidden>`);
  tools.append(up);
  const thumbs = el("div", "thumbs"); tools.append(thumbs);
  s.append(tools);
  const labels = el("div", "tools"); s.append(labels);
  const stage = el("div", "stage"); s.append(stage);
  const bar = el("div", "bar"); const done = el("button", "next", "完成"); done.onclick = findHome; bar.append(done); s.append(bar);
  let label = FIND_LABELS[0];
  FIND_LABELS.forEach(t => { const b = el("button", "chip", t); b.setAttribute("aria-pressed", t === label); b.onclick = () => { label = t; labels.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); custom.value = ""; }; labels.append(b); });
  const custom = el("input"); custom.type = "text"; custom.id = "findCustom"; custom.placeholder = "自訂題目"; custom.oninput = () => { if (custom.value.trim()) { label = custom.value.trim(); labels.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", false)); } };
  labels.append(custom);
  $("#findUpload", up).onchange = async e => {
    for (const f of e.target.files) { try { await DB.put({ id: Date.now() + Math.random(), src: await shrink(f), boxes: [] }); } catch (err) { toast("這張照片讀不到", false); } }
    findEdit((await DB.all()).length - 1);
  };
  function drawThumbs() {
    thumbs.replaceChildren(...photos.map((p, j) => { const b = el("button", "", `<img src="${p.src}" alt="照片 ${j + 1}">`); b.setAttribute("aria-pressed", j === idx); b.onclick = () => findEdit(j); return b; }));
  }
  drawThumbs();
  const cur = photos[idx];
  if (!cur) { stage.append(el("div", "empty", "<h2>按「加入照片」開始</h2>")); return; }
  const ph = el("div", "photo edit", `<img src="${cur.src}" alt="">`); stage.append(ph);
  const del = el("button", "chip", "刪除這張照片"); del.onclick = async () => { await DB.del(cur.id); findEdit(0); }; tools.append(del);
  function drawBoxes() {
    ph.querySelectorAll(".box").forEach(b => b.remove());
    cur.boxes.forEach((b, j) => {
      const d = el("div", "box", `<span>${b.label}　✕</span>`); Object.assign(d.style, { left: b.x + "%", top: b.y + "%", width: b.w + "%", height: b.h + "%" });
      d.querySelector("span").onpointerdown = ev => { ev.stopPropagation(); cur.boxes.splice(j, 1); DB.put(cur); drawBoxes(); };
      ph.append(d);
    });
  }
  drawBoxes();
  ph.onpointerdown = e => {
    const q = ph.getBoundingClientRect(); const x0 = (e.clientX - q.left) / q.width * 100, y0 = (e.clientY - q.top) / q.height * 100;
    const d = el("div", "box drawing"); ph.append(d); ph.setPointerCapture(e.pointerId);
    let r = { x: x0, y: y0, w: 0, h: 0 };
    ph.onpointermove = ev => {
      const x1 = Math.max(0, Math.min(100, (ev.clientX - q.left) / q.width * 100)), y1 = Math.max(0, Math.min(100, (ev.clientY - q.top) / q.height * 100));
      r = { x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
      Object.assign(d.style, { left: r.x + "%", top: r.y + "%", width: r.w + "%", height: r.h + "%" });
    };
    ph.onpointerup = () => {
      ph.onpointermove = ph.onpointerup = null; d.remove();
      if (r.w < 2 || r.h < 2) return;
      cur.boxes.push({ ...r, label }); DB.put(cur); drawBoxes();
    };
  };
}
function findGame(qs) {
  let i = 0, wrong = 0, lock = false, miss = 0;
  const s = screen();
  const p = el("div"), stage = el("div", "stage"); s.append(p, stage);
  function ask() {
    wrong = 0; lock = false;
    const { p: ph, label, rects } = qs[i];
    const many = rects.length > 1 ? `（有 ${rects.length} 個，找到一個就可以）` : "";
    p.replaceChildren(promptEl(`找到「${label}」${many}`, `請在照片上找到${label}`, `${i + 1} / ${qs.length}`));
    const wrap = el("div", "photo", `<img src="${ph.src}" alt="遊客中心照片">`);
    const boxes = rects.map(b => { const d = el("div", "box"); Object.assign(d.style, { left: b.x + "%", top: b.y + "%", width: b.w + "%", height: b.h + "%" }); wrap.append(d); return d; });
    stage.replaceChildren(wrap);
    wrap.onclick = e => {
      if (lock) return;
      const q = wrap.getBoundingClientRect(), x = (e.clientX - q.left) / q.width * 100, y = (e.clientY - q.top) / q.height * 100, pad = 3;
      if (rects.some(b => x >= b.x - pad && x <= b.x + b.w + pad && y >= b.y - pad && y <= b.y + b.h + pad)) {
        lock = true; boxes.forEach(d => { d.classList.remove("hint"); d.classList.add("found"); }); toast("找到了！");
        setTimeout(() => { i++; i < qs.length ? ask() : finish("find", `找到 ${qs.length} 個設計，答錯 ${miss} 次`); }, 1600);
      } else { wrong++; miss++; toast("再找找看", false); if (wrong >= hintAfter()) boxes.forEach(d => d.classList.add("hint")); }
    };
    speak(`請在照片上找到${label}`);
  }
  ask();
}

function showCert() {
  const s = screen();
  const c = el("div", "cert", `<h2>西拉雅建築師</h2><p>完成 4 個建築探險遊戲！</p><p>我認識了水圳之源、湖丘時光、雲水之間，也知道建築師的祕密</p><div class="big">★★★★</div>`);
  const bar = el("div", "bar"); const b = el("button", "next alt", "重新開始");
  b.onclick = () => { for (const k in state.done) state.done[k] = false; renderStars(); save(); home(); };
  bar.append(b); c.append(bar); s.append(c);
  speak("恭喜你，成為西拉雅建築師！"); chime(true);
}

// ---------- 工具列與狀態 ----------
$("#bHome").onclick = home;
$("#bEasy").onclick = e => { state.easy = !state.easy; e.currentTarget.setAttribute("aria-pressed", state.easy); save(); };
$("#bSound").onclick = e => { state.sound = !state.sound; syncSound(); if (!state.sound) try { speechSynthesis.cancel(); } catch (_) {} save(); };
$("#bFull").onclick = async () => { try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch (e) { toast("這個畫面不能全螢幕", false); } };
function syncSound() { $("#bSound").setAttribute("aria-pressed", state.sound); $("#bSound").textContent = state.sound ? "聲音 開" : "聲音 關"; }
try { speechSynthesis.getVoices(); } catch (e) {}
function save() { try { localStorage.setItem("siraya-game2", JSON.stringify({ done: state.done, easy: state.easy, sound: state.sound })); } catch (e) {} }
function start(data) {
  let saved = data && data.done ? data : null;
  if (!saved) try { saved = JSON.parse(localStorage.getItem("siraya-game2") || "null"); } catch (e) {}
  if (saved) { Object.assign(state.done, saved.done || {}); state.easy = !!saved.easy; state.sound = saved.sound !== false; }
  $("#bEasy").setAttribute("aria-pressed", state.easy); syncSound(); renderStars(); home();
}
window.claude?.hot?.snapshot?.(() => ({ done: state.done, easy: state.easy, sound: state.sound }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
