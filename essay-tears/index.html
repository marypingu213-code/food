<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作文小幫手：那次，我流下眼淚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root {
  --paper: #fdf8ef;
  --card: #ffffff;
  --ink: #2a2622;
  --muted: #6b6259;
  --accent: #2f6db5;
  --accent-soft: #e4eefa;
  --warm: #f2a93b;
  --warm-soft: #fff1d9;
  --ok: #2e8b57;
  --ok-soft: #e2f4ea;
  --rec: #d6362b;
  --line: #e2d8c8;
  --display: "Huninn", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 20px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 4px solid var(--warm); outline-offset: 2px; }

header.top { background: var(--card); border-bottom: 4px solid var(--accent); padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
header.top h1 { font-family: var(--display); font-size: 1.25rem; margin: 0; flex: 1 1 auto; }
.save-state { font-size: .8rem; color: var(--muted); }
.speak-toggle { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 12px; font-size: .85rem; }
.speak-toggle[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); }

nav.steps { display: flex; gap: 6px; padding: 12px 16px 0; max-width: 1000px; margin: 0 auto; overflow-x: auto; }
nav.steps button { flex: 1 0 auto; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 10px; font-size: .8rem; white-space: nowrap; }
nav.steps button.done { border-color: var(--ok); background: var(--ok-soft); }
nav.steps button.current { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }

main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 130px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px 20px; margin-bottom: 18px; }
.step-title { font-family: var(--display); font-size: 1.55rem; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.step-title .emoji { font-size: 2.1rem; }
.lead { font-size: 1.05rem; margin: 0 0 4px; color: var(--muted); }
.tip { background: var(--warm-soft); border-left: 6px solid var(--warm); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.topic-box { border: 3px dashed var(--accent); border-radius: 16px; padding: 16px; text-align: center; background: var(--accent-soft); }
.topic-box .t { font-family: var(--display); font-size: 2.1rem; margin: 0; }

label.name { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 700; }
label.name input { font: inherit; padding: 8px 12px; border: 2px solid var(--line); border-radius: 10px; min-width: 0; flex: 1 1 200px; }

/* 題目與選項 */
.q { border-top: 2px dashed var(--line); padding-top: 14px; margin-top: 16px; }
.q:first-of-type { border-top: 0; padding-top: 0; margin-top: 6px; }
.q-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.q-head .text { font-size: 1.2rem; font-weight: 700; }
.badge { font-size: .8rem; border-radius: 999px; padding: 1px 10px; font-weight: 700; }
.badge.one { background: var(--accent-soft); color: var(--accent); }
.badge.many { background: var(--warm-soft); color: #a8620a; }
.badge.skip { background: #eee; color: var(--muted); }
.icon-btn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 2px 10px; font-size: 1rem; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.opts.long { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.opt { position: relative; border: 3px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 12px; text-align: left; display: flex; align-items: center; gap: 8px; min-height: 58px; }
.opt .e { font-size: 1.7rem; line-height: 1; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.opt[aria-pressed="true"]::after { content: "✔"; position: absolute; top: -10px; right: -8px; background: var(--accent); color: #fff; border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; font-size: .85rem; }
.opt.other { border-style: dashed; color: var(--muted); }
.opts.big .opt { flex-direction: column; text-align: center; justify-content: center; min-height: 110px; }
.opts.big .opt .e { font-size: 2.4rem; }
.opts.big .opt small { font-size: .8rem; color: var(--muted); font-weight: 400; }
.other-row { display: flex; gap: 8px; margin-top: 10px; align-items: stretch; }
.other-row input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 3px solid var(--accent); border-radius: 12px; }
.mic { border: 3px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 4px 12px; font-weight: 700; font-size: .9rem; white-space: nowrap; }
.mic.on { border-color: var(--rec); background: #fde3e1; color: var(--rec); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(214,54,43,.5); } 50% { box-shadow: 0 0 0 10px rgba(214,54,43,0); } }
.interim { color: var(--muted); font-size: .9rem; min-height: 1.2em; margin: 2px 0 0; }

/* 即時預覽 */
.preview { background: var(--ok-soft); border: 2px solid var(--ok); border-radius: 16px; padding: 14px 18px; }
.preview h3 { margin: 0 0 6px; font-size: 1.05rem; color: var(--ok); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.preview p { margin: 4px 0; text-indent: 2em; font-size: 1.15rem; line-height: 1.9; }
.preview .empty { text-indent: 0; color: var(--muted); font-size: 1rem; }

/* 完成頁 */
.essay { background: #fffdf7; border: 2px solid var(--line); border-radius: 16px; padding: 18px 22px; }
.essay h2 { text-align: center; font-family: var(--display); margin: 0; font-size: 1.7rem; }
.essay .by { text-align: center; color: var(--muted); margin: 0 0 10px; }
.essay p { text-indent: 2em; font-size: 1.2rem; line-height: 2; margin: 0 0 8px; }
.big-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
.big-actions .btn { font-size: 1.3rem; padding: 18px; }
.para-edit h3 { margin: 14px 0 6px; font-size: 1.05rem; color: var(--accent); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.para-edit textarea { width: 100%; font: inherit; font-size: 1.15rem; line-height: 2; min-height: 130px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 12px; text-indent: 2em; background: #fffdf9; }
.punct { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.punct button { border: 2px solid var(--line); background: var(--card); border-radius: 10px; min-width: 42px; padding: 0 8px; font-size: 1.05rem; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.jump button { border: 2px solid var(--accent); background: var(--card); color: var(--accent); border-radius: 999px; padding: 2px 12px; font-size: .9rem; }
.done-banner { text-align: center; font-family: var(--display); font-size: 1.8rem; color: var(--ok); margin: 0 0 10px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.btn { border: 0; border-radius: 14px; padding: 12px 20px; font-weight: 700; font-size: 1.05rem; background: var(--accent); color: #fff; }
.btn.secondary { background: var(--card); color: var(--accent); border: 3px solid var(--accent); }
.btn.ok { background: var(--ok); }
.btn.warn { background: var(--card); color: var(--rec); border: 2px solid var(--rec); font-size: .9rem; padding: 6px 12px; }

footer.nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 3px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; gap: 10px; z-index: 10; }
footer.nav .btn { min-width: 140px; font-size: 1.2rem; }
footer.nav .btn[disabled] { opacity: .35; cursor: default; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }
details.teacher { font-size: .9rem; color: var(--muted); }
details.teacher summary { cursor: pointer; font-weight: 700; }
.sub-list { list-style: none; padding: 0; margin: 8px 0; }
.sub-list li { border-bottom: 1px solid var(--line); padding: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--ink); }
.sub-list li b { flex: 1 1 200px; }
.sub-list button { border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 2px 10px; font-size: .85rem; }
#printArea { display: none; }

@media (max-width: 560px) {
  body { font-size: 18px; }
  .opts { grid-template-columns: repeat(2, 1fr); }
  .opts.long { grid-template-columns: 1fr; }
  footer.nav .btn { min-width: 0; flex: 1; }
}
@media print {
  @page { size: A4 portrait; margin: 14mm; }
  body { background: #fff; font-size: 14pt; }
  header.top, nav.steps, main, footer.nav, .toast { display: none !important; }
  #printArea { display: block; color: #000; }
  .p-title { text-align: center; font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", serif; font-size: 22pt; margin: 0 0 4mm; }
  .p-meta { display: flex; justify-content: space-between; font-size: 12pt; margin-bottom: 6mm; border-bottom: 1px solid #000; padding-bottom: 2mm; }
  .p-lined p { font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", serif; font-size: 16pt; line-height: 13mm; text-indent: 2em; margin: 0;
    background-image: linear-gradient(to bottom, transparent calc(13mm - 1px), #999 calc(13mm - 1px)); background-size: 100% 13mm; }
  .p-grid { display: grid; grid-template-columns: repeat(20, 1fr); border-left: 1px solid #555; border-top: 1px solid #555; }
  .p-grid span { aspect-ratio: 1 / 1; border-right: 1px solid #555; border-bottom: 1px solid #555; display: grid; place-items: center;
    font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", serif; font-size: 15pt; break-inside: avoid; }
}
</style>
</head>
<body>
<header class="top">
  <h1>✏️ 作文小幫手：那次，我流下眼淚</h1>
  <button class="speak-toggle" id="speakToggle" aria-pressed="true">🔈 點選時唸出來</button>
  <span class="save-state" id="saveState">會自動儲存在這台裝置</span>
</header>
<nav class="steps" id="stepNav" aria-label="寫作步驟"></nav>
<main id="main"></main>
<footer class="nav">
  <button class="btn secondary" id="prevBtn">⬅ 上一步</button>
  <button class="btn" id="nextBtn">下一步 ➡</button>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>

<script>
(() => {
const TITLE = '那次，我流下眼淚';
const STORE = 'essay-tears-v2';
const SUBMIT_STORE = 'essay-tears-submitted';

/* ================================================================
   選項資料：{P} 會換成學生選的人物（例如：媽媽）
   ================================================================ */
const TYPES = [
  { v: 'sad', e: '😢', label: '難過的眼淚', sub: '失敗、失去、分開', fallbackP: '大家' },
  { v: 'wronged', e: '😣', label: '委屈的眼淚', sub: '被誤會、被冤枉', fallbackP: '大家' },
  { v: 'moved', e: '🥹', label: '感動的眼淚', sub: '家人、朋友對我好', fallbackP: '家人' },
  { v: 'happy', e: '🥳', label: '開心的眼淚', sub: '努力很久終於成功', fallbackP: '大家' }
];

const EVENTS = {
  sad: [
    { v: '比賽輸了', e: '🏃', open: '參加一場很重要的比賽',
      steps: ['比賽前，我們每天都很認真地練習。', '比賽開始了，我用盡全力去拚。', '沒想到，我在最重要的時候出了錯。', '最後，我們輸掉了比賽。'] },
    { v: '考試沒考好', e: '📝', open: '準備一次很重要的考試',
      steps: ['考試前，我每天都認真複習。', '考試的時候，我發現好多題目都不會寫。', '考卷發下來，分數比我想的低很多。', '我不敢把考卷拿給家人看。'] },
    { v: '寵物生病或離開', e: '🐶', open: '照顧我最愛的寵物',
      steps: ['我的寵物陪我度過了好多快樂的時光。', '有一天，牠突然生病了，一直沒有精神。', '我們帶牠去看醫生，可是牠還是越來越虛弱。', '最後，牠離開了我。'] },
    { v: '和好朋友吵架', e: '💢', open: '一起玩',
      steps: ['一開始，我們玩得很開心。', '後來，我們為了一件小事意見不一樣。', '我們越吵越大聲，誰也不讓誰。', '好朋友生氣地轉身走掉了。'] }
  ],
  wronged: [
    { v: '被同學誤會', e: '🙅', open: '上課',
      steps: ['同學的東西突然不見了。', '有人說是我拿的。', '我一直解釋，可是大家都不相信我。', '大家都用奇怪的眼神看著我。'] },
    { v: '不是我做的卻被罵', e: '😠', open: '做自己的事',
      steps: ['突然，有東西被弄壞了。', '大人以為是我做的，大聲地罵我。', '我想解釋，可是沒有人聽我說。', '我只好一個人站在旁邊。'] },
    { v: '被別人嘲笑', e: '🤭', open: '參加一個活動',
      steps: ['我很認真地做好自己的事。', '沒想到，有人在旁邊笑我。', '越來越多人跟著一起笑。', '我覺得好丟臉，好想躲起來。'] },
    { v: '說實話卻沒人相信', e: '🗣️', open: '說一件真的發生過的事',
      steps: ['我把事情原原本本地說出來。', '可是大家都覺得我在說謊。', '我越說，大家越不相信。', '我覺得好無助。'] }
  ],
  moved: [
    { v: '生病時家人照顧我', e: '🤒', open: '度過一個生病的夜晚',
      steps: ['那天，我突然發高燒，全身都好不舒服。', '{P}一直守在我身邊，幫我量體溫、擦汗。', '整個晚上，{P}都沒有好好睡覺。', '第二天早上，我看見{P}累得趴在床邊睡著了。'] },
    { v: '朋友幫助我', e: '🤝', open: '遇到一個大難題',
      steps: ['我遇到一個自己解決不了的難題。', '我急得不知道該怎麼辦。', '這時候，{P}主動過來幫助我。', '{P}一直陪著我，直到問題解決。'] },
    { v: '收到生日驚喜', e: '🎂', open: '過生日',
      steps: ['那天，我以為大家都忘了我的生日。', '我一整天都悶悶不樂。', '突然，大家唱著生日快樂歌走了出來。', '{P}送給我一份特別準備的禮物。'] },
    { v: '老師鼓勵我', e: '👩‍🏫', open: '上課',
      steps: ['我一直覺得自己做不好，很沒有信心。', '有一次，我又做錯了，難過得想放棄。', '{P}走過來，蹲下來跟我說話。', '{P}告訴我，我已經進步很多了。'] }
  ],
  happy: [
    { v: '學會騎腳踏車', e: '🚲', open: '練習騎腳踏車',
      steps: ['一開始，我一直摔倒，膝蓋都破皮了。', '{P}在後面扶著我，一次又一次地陪我練習。', '我一直告訴自己：「不要放棄！」', '有一天，我終於自己騎了好遠好遠。'] },
    { v: '比賽得獎', e: '🏆', open: '參加一場比賽',
      steps: ['比賽前，我花了很多時間練習。', '比賽的時候，我好緊張，可是我還是盡力表現。', '宣布名次的時候，我緊張得一直發抖。', '沒想到，我竟然聽見了自己的名字！'] },
    { v: '考試進步了', e: '💯', open: '準備考試',
      steps: ['以前，我的成績一直不太好。', '這次，我每天都認真複習，不會的就去問。', '考卷發下來，我的分數比以前進步好多。', '{P}還在大家面前稱讚我。'] },
    { v: '表演成功了', e: '🎤', open: '準備一場表演',
      steps: ['為了這場表演，我們練習了好久。', '上台前，我緊張得手心一直冒汗。', '表演的時候，我把練習的都表現出來了。', '表演結束時，台下響起了好大的掌聲。'] }
  ]
};
const GENERIC_STEPS = {
  sad: ['一開始，事情看起來都很順利。', '沒想到，事情突然變糟了。', '我很努力，結果還是不如預期。', '最後，事情變得沒辦法挽回。'],
  wronged: ['一開始，一切都很平常。', '突然，發生了一件我意想不到的事。', '大家都以為是我的錯。', '我想解釋，可是沒有人聽我說。'],
  moved: ['那時候，我遇到了困難，心裡很不好受。', '這時候，{P}來到我的身邊。', '{P}為我做了好多好多事。', '我發現{P}一直默默地關心我。'],
  happy: ['一開始，我怎麼樣都做不好。', '我沒有放棄，一次又一次地努力練習。', '{P}一直在旁邊為我加油。', '最後，我終於成功了！']
};
const SEE_HEAR = {
  sad: ['我看見{P}失望的表情。', '我聽見大家「唉——」的嘆氣聲。', '我看見別人開心地歡呼，我卻笑不出來。', '四周好像突然變得好安靜。', '我聽見{P}輕輕地叫我的名字。'],
  wronged: ['我看見大家都轉過頭來看著我。', '我聽見有人在小聲地說我的壞話。', '我看見{P}生氣地瞪著我。', '我聽見自己的心跳得好大聲。', '教室裡安靜得好可怕。'],
  moved: ['我看見{P}的眼睛紅紅的，好像很累。', '我聽見{P}溫柔地叫我的名字。', '我看見{P}對我露出溫暖的笑容。', '我聽見大家為我加油的聲音。', '我看見{P}的手上拿著要送給我的東西。'],
  happy: ['我聽見{P}大聲地為我加油。', '我看見大家都在為我拍手。', '我看見{P}笑得好開心。', '我聽見好大的歡呼聲。', '我看見自己的名字出現在前面。']
};
const SPEECH = {
  sad: [{ t: '對不起，都是我不好……', me: 1 }, { t: '為什麼會這樣？', me: 1 }, { t: '我好想再試一次。', me: 1 }, { t: '沒關係，你已經很努力了。', me: 0 }, { t: '下次我們再一起加油！', me: 0 }],
  wronged: [{ t: '不是我做的！', me: 1 }, { t: '為什麼大家都不相信我？', me: 1 }, { t: '請你們聽我說！', me: 1 }, { t: '對不起，是我們誤會你了。', me: 0 }, { t: '我相信你。', me: 0 }],
  moved: [{ t: '謝謝你，我好愛你！', me: 1 }, { t: '你辛苦了。', me: 1 }, { t: '有你真好。', me: 1 }, { t: '傻孩子，不要哭。', me: 0 }, { t: '我會一直陪著你。', me: 0 }],
  happy: [{ t: '我做到了！', me: 1 }, { t: '太棒了，我成功了！', me: 1 }, { t: '謝謝你一直陪我！', me: 1 }, { t: '你真的好厲害！', me: 0 }, { t: '我就知道你可以的！', me: 0 }]
};

/* ================= 文句產生與潤飾 ================= */
function clean(s) { return String(s || '').trim().replace(/\s+/g, '').replace(/[，。！？、,.!?；;]+$/, ''); }
function joinList(a) { return a.length <= 1 ? (a[0] || '') : a.length === 2 ? a[0] + '和' + a[1] : a.slice(0, -1).join('、') + '和' + a[a.length - 1]; }
function end(s) { s = s.trim(); return !s ? '' : /[。！？」…]$/.test(s) ? s : s.replace(/[，、；：,]$/, '') + '。'; }
// 取得某題的有效選擇（排除已不存在的選項），自己寫的內容放最後
function vals(id) {
  const q = Q[id];
  const valid = q.opts().map(o => o.v);
  const out = (state.sel[id] || []).filter(v => valid.includes(v));
  if ((state.sel[id] || []).includes('__other') && clean(state.other[id])) out.push({ other: clean(state.other[id]) });
  return out;
}
function one(id) { return vals(id)[0]; }
function persons() {
  return vals('who').map(v => typeof v === 'object' ? v.other : v).filter(v => v !== '只有我自己');
}
function P() { const p = persons(); return p.length === 1 ? p[0] : p.length ? p[0] : (typeObj()?.fallbackP || '大家'); }
function R(s) { return String(s).replace(/\{P\}/g, P()); }
function txt(v) { return typeof v === 'object' ? v.other : R(v); }

function genParas() {
  const t = T();
  const paras = ['', '', '', ''];
  // 第一段：時間、地點、人物、事件、事前心情
  {
    const time = one('time'), place = one('place'), ev = one('event'), ps = persons();
    let s = '';
    if (time) s += txt(time) + '，';
    s += ps.length ? '我和' + joinList(ps) : '我';
    if (place) s += '在' + txt(place);
    const eo = evObj();
    if (eo) s += eo.open + '。';
    else if (ev) s += '，發生了一件讓我難忘的事：' + txt(ev) + '。';
    else s = (time || place || ps.length) ? s + '。' : '';
    const b = one('before');
    if (b) s += `那時候，我的心裡${txt(b)}。`;
    if (s) s += '沒想到，這件事竟然讓我流下了眼淚。';
    paras[0] = s;
  }
  // 第二段：經過 + 看見聽見
  paras[1] = [...vals('steps'), ...vals('see')].map(v => end(txt(v))).join('');
  // 第三段：表情、動作、語言、心理
  {
    let s = '';
    const face = vals('face').map(txt);
    if (face.length) s += '那一刻，' + face.join('，') + '。';
    const act = vals('act').map(txt);
    if (act.length) s += (face.length ? '' : '那一刻，') + '我' + act.join('，') + '。';
    vals('say').forEach(v => {
      if (typeof v === 'object') s += `我說：「${end(v.other)}」`;
      else {
        const o = Q.say.opts().find(o => o.v === v);
        s += o && o.me ? `我${TONE[t] || '說'}：「${R(v)}」` : `${P()}對我說：「${R(v)}」`;
      }
    });
    const feel = vals('feel').map(txt);
    if (feel.length) {
      let f = feel.length === 1 ? '我的心裡好' + feel[0] : '我的心裡又' + feel.join('又');
      if (one('like')) f += '，' + txt(one('like'));
      s += f + '。';
    } else if (one('like')) s += '我的心' + txt(one('like')) + '。';
    const th = one('think');
    if (th) s += `我心想：「${end(txt(th))}」`;
    paras[2] = s;
  }
  // 第四段：原因、結果、心情變化、體會、以後
  {
    let s = '';
    const why = one('why');
    if (why) s += `我會流下眼淚，是因為${txt(why)}。`;
    const later = one('later');
    if (later) s += `後來，${txt(later)}。`;
    const after = one('after');
    if (after) s += `哭完以後，我${Q.after.opts().find(o => o.v === after)?.s || txt(after)}。`;
    const learn = vals('learn').map(txt);
    if (learn.length === 1) s += `這次流淚讓我明白了：${learn[0]}。`;
    else if (learn.length > 1) s += `這次流淚讓我明白了：${learn.slice(0, -1).join('；')}；也明白了${learn[learn.length - 1]}。`;
    const fu = one('future');
    if (fu) s += end(txt(fu));
    if (s) s += '那一次流下的眼淚，我永遠都不會忘記。';
    paras[3] = s;
  }
  return paras;
}
function finalParas() { return (state.custom || genParas()).map(p => p.trim()).filter(Boolean); }
function countChars(a) { return a.join('').replace(/\s/g, '').length; }

/* ================= 朗讀 ================= */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW'; u.rate = 0.85;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ================= 語音輸入 ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recEl = null;
function stopRec() { if (rec) { try { rec.stop(); } catch (e) {} } }
function startRec(btn, el, interimEl) {
  if (!SR) { alert('這個瀏覽器不支援網頁語音輸入。\n\n・電腦：請用 Chrome 或 Edge\n・iPad／手機：點一下輸入框，再按鍵盤上的 🎤 麥克風鍵'); el.focus(); return; }
  if (rec) { const same = recEl === el; stopRec(); if (same) return; }
  const r = new SR();
  r.lang = 'zh-TW'; r.continuous = true; r.interimResults = true;
  rec = r; recEl = el;
  const orig = btn.textContent;
  btn.classList.add('on'); btn.textContent = '⏹ 說完按我';
  if (interimEl) interimEl.textContent = '🎙️ 請開始說話…';
  r.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const res = ev.results[i];
      if (res.isFinal) insertText(el, res[0].transcript.replace(/\s+/g, ''));
      else interim += res[0].transcript;
    }
    if (interimEl) interimEl.textContent = interim ? '🎙️ ' + interim : '';
  };
  r.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') alert('沒有麥克風權限。請在瀏覽器網址列旁邊允許使用麥克風。');
    else if (ev.error === 'no-speech') toast('沒有聽到聲音，再試一次');
    else if (ev.error !== 'aborted') toast('語音輸入出了問題：' + ev.error);
  };
  r.onend = () => { btn.classList.remove('on'); btn.textContent = orig; if (interimEl) interimEl.textContent = ''; if (rec === r) { rec = null; recEl = null; } };
  try { r.start(); } catch (e) { r.onend(); }
}
function insertText(el, text) {
  const useCursor = document.activeElement === el || el._hadFocus;
  const s = useCursor ? el.selectionStart : el.value.length, e = useCursor ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, s) + text + el.value.slice(e);
  el.setSelectionRange(s + text.length, s + text.length);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

/* ================= 畫面 ================= */
function qHtml(id) {
  const q = Q[id];
  let opts = q.opts();
  if (!persons().length) opts = opts.filter(o => !o.needP);
  const sel = state.sel[id] || [];
  const badge = q.mode === 'one' ? '<span class="badge one">選一個</span>' : '<span class="badge many">可以選很多個</span>';
  const skip = q.req ? '' : '<span class="badge skip">可以跳過</span>';
  const otherOn = sel.includes('__other');
  return `<div class="q" data-qbox="${id}">
    <div class="q-head"><span class="text">${esc(q.q)}</span>${badge}${skip}
      <button class="icon-btn" data-speak="${esc(q.q)}" aria-label="朗讀題目">🔊</button></div>
    ${q.hint ? `<div class="lead" style="margin-top:-4px">${esc(q.hint)}</div>` : ''}
    <div class="opts${q.long ? ' long' : ''}${q.big ? ' big' : ''}">
      ${opts.map(o => `<button class="opt" data-q="${id}" data-v="${esc(o.v)}" aria-pressed="${sel.includes(o.v)}">${o.e ? `<span class="e"${Array.from(o.e).length > 2 ? ' style="font-size:1rem;white-space:nowrap"' : ''}>${esc(R(o.e))}</span>` : ''}<span>${esc(R(o.v))}${o.sub ? `<br><small>${esc(o.sub)}</small>` : ''}</span></button>`).join('')}
      ${q.other ? `<button class="opt other" data-q="${id}" data-v="__other" aria-pressed="${otherOn}"><span class="e">✏️</span><span>${esc(q.other)}</span></button>` : ''}
    </div>
    ${q.other && otherOn ? `<div class="other-row"><input data-other="${id}" value="${esc(state.other[id] || '')}" placeholder="用打的，或按麥克風用說的"><button class="mic" data-mic-other="${id}">🎤 用說的</button></div><p class="interim" data-interim="${id}"></p>` : ''}
  </div>`;
}
function previewHtml(pg) {
  if (!pg.paras || !pg.paras.length) return '';
  const paras = genParas();
  const shown = pg.paras.map(i => paras[i]).filter(Boolean);
  return `<section class="preview" id="preview"><h3>📝 小幫手幫你寫成句子了 <button class="icon-btn" data-speak-preview="1">🔊 唸給我聽</button></h3>
    ${shown.length ? shown.map(p => `<p>${esc(p)}</p>`).join('') : '<p class="empty">點選上面的選項，句子就會出現在這裡。</p>'}</section>`;
}
function updatePreview() {
  const el = $('preview');
  if (!el) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = previewHtml(PAGES[state.page]);
  el.replaceWith(tmp.firstElementChild);
}
function pageDone(i) {
  const pg = PAGES[i];
  if (!pg.qs) return !!state.submittedAt;
  return pg.qs.every(id => !Q[id].req || vals(id).length);
}
function renderNav() {
  $('stepNav').innerHTML = PAGES.map((p, i) => `<button data-go="${i}" class="${i === state.page ? 'current' : (p.qs ? p.qs.some(id => vals(id).length) && pageDone(i) : state.submittedAt) ? 'done' : ''}">${p.nav}</button>`).join('');
  $('prevBtn').disabled = state.page === 0;
  const last = state.page === PAGES.length - 1;
  $('nextBtn').style.visibility = last ? 'hidden' : 'visible';
  $('nextBtn').textContent = state.page === PAGES.length - 2 ? '看我的作文 ✅' : '下一步 ➡';
}

function render(keepScroll) {
  stopRec();
  const y = window.scrollY;
  const pg = PAGES[state.page];
  let h = '';
  if (pg.id === 'start') {
    h = `<section class="card">
      <div class="topic-box"><p class="t">${TITLE}</p></div>
      <p style="margin:12px 0 4px">每個人都哭過。這次我們要寫一次讓你<b>印象很深的流淚經驗</b>。</p>
      <p style="margin:0 0 12px">你只要<b>一題一題點選答案</b>，小幫手就會幫你把句子寫好，最後變成一篇作文！</p>
      <button class="btn secondary" data-speak="作文題目，那次，我流下眼淚。每個人都哭過。這次我們要寫一次讓你印象很深的流淚經驗。你只要一題一題點選答案，小幫手就會幫你把句子寫好。">🔊 唸給我聽</button>
      <label class="name" style="margin-top:14px">✍️ 我的名字：<input id="nameInput" value="${esc(state.name)}" placeholder="寫上名字" autocomplete="off"></label>
    </section>
    <section class="card">${qHtml('type')}</section>
    ${teacherHtml()}`;
  } else if (pg.qs) {
    const ev = one('event');
    h = `<section class="card">
      <h2 class="step-title"><span class="emoji">${pg.emoji}</span>${pg.title}</h2>
      ${T() ? `<p class="lead">${typeObj().e} ${typeObj().label}${ev ? '・' + esc(txt(ev)) : ''}</p>` : ''}
      ${pg.qs.map(qHtml).join('')}
    </section>
    ${previewHtml(pg)}`;
  } else {
    h = finalHtml();
  }
  $('main').innerHTML = h;
  renderNav();
  window.scrollTo(0, keepScroll ? y : 0);
}

function essayBox(paras) {
  return `<div class="essay"><h2>${TITLE}</h2><p class="by">${esc(state.name || '')}</p>${paras.map(p => `<p>${esc(p)}</p>`).join('') || '<p style="text-indent:0">還沒有內容，請回到前面點選答案。</p>'}</div>`;
}
function finalHtml() {
  const gen = genParas();
  const paras = finalParas();
  const stale = state.custom && JSON.stringify(gen) !== state.customSrc;
  const missing = PAGES.filter(p => p.qs && !pageDone(PAGES.indexOf(p)));
  if (state.view === 'done') {
    return `<section class="card">
      <p class="done-banner">🎉 作文送出了！你好棒！</p>
      ${essayBox(paras)}
      <p>全文共 <b>${countChars(paras)}</b> 字　・　送出時間：${esc(state.submittedAt)}</p>
      <div class="actions">
        <button class="btn ok" data-print="lined">🖨️ 列印（橫線紙）</button>
        <button class="btn ok" data-print="grid">🖨️ 列印（稿紙格子）</button>
        <button class="btn secondary" data-dl="doc">💾 下載 Word 檔</button>
        <button class="btn secondary" data-dl="txt">💾 下載文字檔</button>
      </div>
      <p style="font-size:.9rem;color:var(--muted)">想存成 PDF：按「列印」後，印表機選「另存為 PDF」。</p>
      <div class="actions">
        <button class="btn secondary" data-view="edit">✏️ 我還想再修改</button>
        <button class="btn warn" id="newEssay">🆕 寫一篇新的作文</button>
      </div>
    </section>`;
  }
  if (state.view === 'edit') {
    const cur = state.custom || gen;
    return `<section class="card">
      <h2 class="step-title"><span class="emoji">✏️</span>修改我的作文</h2>
      <div class="tip"><b>方法一：回去改選項</b>（小幫手會重新幫你寫句子）
        <div class="jump">${PAGES.filter(p => p.qs).map(p => `<button data-go="${PAGES.indexOf(p)}">${p.emoji} ${p.title}</button>`).join('')}</div>
        <b>方法二：直接改下面的文字</b>（可以打字，也可以用說的）</div>
      <div class="para-edit">${cur.map((p, i) => `<div><h3>第${'一二三四五六'[i] || i + 1}段 <button class="mic" data-mic-para="${i}">🎤 用說的加句子</button></h3>
        <textarea data-para="${i}">${esc(p)}</textarea><p class="interim" data-interim="para${i}"></p>
        <div class="punct">${['，', '。', '！', '？', '「', '」', '：'].map(c => `<button data-punct="${c}" data-para-t="${i}">${c}</button>`).join('')}</div></div>`).join('')}</div>
      <div class="big-actions">
        <button class="btn ok" data-view="preview">✅ 改好了</button>
        ${state.custom ? '<button class="btn secondary" id="restore">↩️ 還原成小幫手寫的</button>' : ''}
      </div>
    </section>`;
  }
  return `<section class="card">
    <h2 class="step-title"><span class="emoji">🎉</span>你的作文完成了！</h2>
    ${missing.length ? `<div class="tip">⚠️ 還有地方沒選：${missing.map(p => `<button class="icon-btn" data-go="${PAGES.indexOf(p)}">${p.emoji} ${p.title}</button>`).join(' ')}</div>` : ''}
    ${stale ? `<div class="tip">🔄 你改過前面的選項，但這篇作文是你之前改過的文字。<div class="actions"><button class="btn secondary" id="useGen">用新的選項重新產生</button><button class="btn secondary" id="keepCustom">保留我改的文字</button></div></div>` : ''}
    ${essayBox(paras)}
    <p>全文共 <b>${countChars(paras)}</b> 字　<button class="icon-btn" id="readAll">🔊 唸整篇給我聽</button></p>
    <p class="lead">讀一讀，你想要修改，還是送出呢？</p>
    <div class="big-actions">
      <button class="btn secondary" data-view="edit">✏️ 我要修改</button>
      <button class="btn ok" id="submit">📮 送出作文</button>
    </div>
  </section>`;
}
function teacherHtml() {
  const subs = getSubs();
  return `<details class="teacher card"><summary>👩‍🏫 給老師：使用說明與已送出的作文（${subs.length} 篇）</summary>
    <p>・學生依序點選：類型 → 事件 → 時間、地點、人物 → 經過 → 看見聽見 → 表情、動作 → 語言、心理 → 原因、結果、心情變化 → 體會。每題都標示「選一個／可以選很多個／可以跳過」。</p>
    <p>・每頁下方會即時顯示小幫手組好的句子。選項依「眼淚類型」和「事件」變化，系統會自動加上連接詞、標點，並把人物帶進句子裡。</p>
    <p>・想寫的不在選項裡，可以按「✏️ 自己寫」用打字或語音補充。最後可以選擇修改（回去改選項或直接改文字）或送出。</p>
    <p>・語音：電腦請用 Chrome／Edge；iPad 可用鍵盤上的麥克風鍵。右上角可以關閉「點選時唸出來」。</p>
    <p>・送出的作文會存在<b>這台裝置</b>的瀏覽器中，可在下面列印或下載。</p>
    ${subs.length ? `<ul class="sub-list">${subs.map((s, i) => `<li><b>${esc(s.name || '（未寫名字）')}　${esc(s.at)}　${countChars(s.paras)} 字</b>
      <button data-sub-print="${i}">🖨️ 列印</button><button data-sub-dl="${i}">💾 Word</button><button data-sub-del="${i}">🗑️ 刪除</button></li>`).join('')}</ul>` : '<p>目前還沒有送出的作文。</p>'}
  </details>`;
}

/* ================= 列印與下載 ================= */
function doPrint(mode, paras, name) {
  if (!paras.length) { toast('還沒有內容可以列印'); return; }
  const meta = `<div class="p-meta"><span>姓名：${esc(name || '＿＿＿＿＿＿')}</span><span>字數：${countChars(paras)} 字</span><span>日期：${new Date().toLocaleDateString('zh-TW')}</span></div>`;
  let body;
  if (mode === 'grid') {
    const rows = [];
    paras.forEach(p => { const ch = Array.from('　　' + p); for (let i = 0; i < ch.length; i += 20) { const r = ch.slice(i, i + 20); while (r.length < 20) r.push(''); rows.push(r); } });
    const minRows = Math.max(rows.length + 2, 20); while (rows.length < minRows) rows.push(Array(20).fill(''));
    body = `<div class="p-grid">${rows.flat().map(c => `<span>${esc(c)}</span>`).join('')}</div>`;
  } else body = `<div class="p-lined">${paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
  $('printArea').innerHTML = `<h1 class="p-title">${TITLE}</h1>${meta}${body}`;
  setTimeout(() => window.print(), 50);
}
function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function dl(kind, paras, name) {
  const base = `${TITLE.replace(/，/g, '_')}_${name || '作文'}`;
  if (kind === 'txt') download(base + '.txt', '﻿' + `${TITLE}\n姓名：${name}\n\n` + paras.map(p => '　　' + p).join('\n\n') + '\n', 'text/plain;charset=utf-8');
  else download(base + '.doc', '﻿' + `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${TITLE}</title>
    <style>body{font-family:"標楷體","DFKai-SB",serif;font-size:16pt;line-height:2}h1{text-align:center;font-size:22pt}p{text-indent:2em;margin:0 0 6pt}</style></head>
    <body><h1>${TITLE}</h1><p style="text-indent:0">姓名：${esc(name)}</p>${paras.map(p => `<p>${esc(p)}</p>`).join('')}</body></html>`, 'application/msword');
}

/* ================= 事件 ================= */
function go(n) {
  state.page = Math.max(0, Math.min(PAGES.length - 1, n));
  if (PAGES[state.page].id === 'final' && state.view !== 'done') state.view = 'preview';
  save(true); render();
}
$('prevBtn').onclick = () => go(state.page - 1);
$('nextBtn').onclick = () => {
  const pg = PAGES[state.page];
  const need = (pg.qs || []).find(id => Q[id].req && !vals(id).length);
  if (need) { toast('請先回答：' + Q[need].q.replace(/（.*）/, '')); speak('請先回答：' + Q[need].q.replace(/（.*）/, '')); document.querySelector(`[data-qbox="${need}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  go(state.page + 1);
};
$('speakToggle').onclick = () => {
  speakOn = !speakOn; $('speakToggle').setAttribute('aria-pressed', speakOn);
  try { localStorage.setItem('essay-speak', speakOn ? 'on' : 'off'); } catch (e) {}
};
$('speakToggle').setAttribute('aria-pressed', speakOn);

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.go !== undefined) { if (state.view === 'edit' && PAGES[+d.go].qs) state.view = 'preview'; go(+d.go); }
  else if (d.speak) speak(d.speak);
  else if (d.speakPreview) { const pg = PAGES[state.page]; speak(pg.paras.map(i => genParas()[i]).join('')); }
  else if (d.q) {
    const q = Q[d.q], v = d.v;
    let sel = state.sel[d.q] || [];
    const on = sel.includes(v);
    if (q.mode === 'one') sel = on ? [] : [v];
    else {
      sel = on ? sel.filter(x => x !== v) : [...sel, v];
      if (d.q === 'who' && !on) sel = v === '只有我自己' ? [v] : sel.filter(x => x !== '只有我自己');
    }
    state.sel[d.q] = sel;
    if (!on && speakOn && v !== '__other') speak(R(v));
    save(); render(true);
    if (v === '__other' && !on) { const inp = document.querySelector(`[data-other="${d.q}"]`); inp && inp.focus(); }
  }
  else if (d.micOther) startRec(b, document.querySelector(`[data-other="${d.micOther}"]`), document.querySelector(`[data-interim="${d.micOther}"]`));
  else if (d.micPara !== undefined) startRec(b, document.querySelector(`textarea[data-para="${d.micPara}"]`), document.querySelector(`[data-interim="para${d.micPara}"]`));
  else if (d.punct) { const ta = document.querySelector(`textarea[data-para="${d.paraT}"]`); insertText(ta, d.punct); ta.focus({ preventScroll: true }); }
  else if (d.view) {
    if (d.view === 'edit' && !state.custom) { state.custom = genParas(); state.customSrc = JSON.stringify(genParas()); }
    if (d.view === 'edit' && state.submittedAt) state.submittedAt = '';
    state.view = d.view; save(true); render();
  }
  else if (b.id === 'restore') { if (confirm('要還原成小幫手寫的句子嗎？你改過的文字會不見。')) { state.custom = null; state.view = 'preview'; save(true); render(); } }
  else if (b.id === 'useGen') { state.custom = null; save(true); render(true); }
  else if (b.id === 'keepCustom') { state.customSrc = JSON.stringify(genParas()); save(true); render(true); }
  else if (b.id === 'readAll') speak(TITLE + '。' + finalParas().join(''));
  else if (b.id === 'submit') {
    const paras = finalParas();
    if (!paras.length) { toast('還沒有內容喔'); return; }
    if (!confirm('確定要送出作文嗎？')) return;
    state.submittedAt = new Date().toLocaleString('zh-TW', { dateStyle: 'short', timeStyle: 'short' });
    state.view = 'done';
    const subs = getSubs(); subs.unshift({ name: state.name, at: state.submittedAt, paras }); setSubs(subs);
    save(true); render(); speak('作文送出了！你好棒！');
  }
  else if (d.print) doPrint(d.print, finalParas(), state.name);
  else if (d.dl) dl(d.dl, finalParas(), state.name);
  else if (b.id === 'newEssay') { if (confirm('要開始寫一篇新的作文嗎？（已送出的作文老師還看得到）')) { state = blank(); save(true); render(); } }
  else if (d.subPrint !== undefined) { const s = getSubs()[+d.subPrint]; doPrint('lined', s.paras, s.name); }
  else if (d.subDl !== undefined) { const s = getSubs()[+d.subDl]; dl('doc', s.paras, s.name); }
  else if (d.subDel !== undefined) { if (confirm('確定刪除這篇已送出的作文？')) { const a = getSubs(); a.splice(+d.subDel, 1); setSubs(a); render(true); const det = document.querySelector('details.teacher'); if (det) det.open = true; } }
});
document.addEventListener('mousedown', e => { if (e.target.closest('.punct button')) e.preventDefault(); });
document.addEventListener('focusin', e => { if (e.target.matches('textarea, input')) e.target._hadFocus = true; });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'nameInput') state.name = t.value;
  else if (t.dataset.other) { state.other[t.dataset.other] = t.value; updatePreview(); }
  else if (t.dataset.para !== undefined) { state.custom[+t.dataset.para] = t.value; }
  else return;
  save();
});
window.addEventListener('afterprint', () => { $('printArea').innerHTML = ''; });
if ('speechSynthesis' in window) speechSynthesis.getVoices();
render();
})();
</script>
</body>
</html>
