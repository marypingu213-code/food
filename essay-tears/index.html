<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作文小幫手：那次，我流下眼淚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root {
  --paper: #fdf8ef;
  --card: #ffffff;
  --ink: #2a2622;
  --muted: #6b6259;
  --accent: #2f6db5;
  --accent-soft: #e4eefa;
  --warm: #f2a93b;
  --warm-soft: #fff1d9;
  --ok: #2e8b57;
  --ok-soft: #e2f4ea;
  --help: #8a4fbf;
  --help-soft: #f3eafb;
  --rec: #d6362b;
  --line: #e2d8c8;
  --display: "Huninn", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 20px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 4px solid var(--warm); outline-offset: 2px; }

header.top { background: var(--card); border-bottom: 4px solid var(--accent); padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
header.top h1 { font-family: var(--display); font-size: 1.3rem; margin: 0; flex: 1 1 auto; }
.save-state { font-size: .85rem; color: var(--muted); }

nav.steps { display: flex; gap: 6px; padding: 12px 16px 0; max-width: 980px; margin: 0 auto; overflow-x: auto; }
nav.steps button { flex: 1 0 auto; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: .85rem; white-space: nowrap; }
nav.steps button.done { border-color: var(--ok); background: var(--ok-soft); }
nav.steps button.current { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }

main { max-width: 980px; margin: 0 auto; padding: 16px 16px 120px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 18px; }
.step-title { font-family: var(--display); font-size: 1.6rem; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.step-title .emoji { font-size: 2.2rem; }
.lead { font-size: 1.1rem; margin: 0 0 4px; }
.tip { background: var(--warm-soft); border-left: 6px solid var(--warm); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }

.topic-box { border: 3px dashed var(--accent); border-radius: 16px; padding: 18px; text-align: center; background: var(--accent-soft); }
.topic-box .t { font-family: var(--display); font-size: 2.2rem; margin: 0; }
ol.simple { padding-left: 1.4em; margin: 8px 0; }
ol.simple li { margin: 6px 0; }

label.name { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 700; margin-top: 14px; }
label.name input { font: inherit; padding: 8px 12px; border: 2px solid var(--line); border-radius: 10px; min-width: 0; flex: 1 1 200px; }

.mode-switch { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
.mode-switch button { flex: 1 1 220px; border: 3px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px; font-weight: 700; }
.mode-switch button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

.types { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.type { border: 3px solid var(--line); border-radius: 16px; background: var(--card); padding: 10px; text-align: center; }
.type .e { font-size: 2.2rem; display: block; }
.type b { font-size: 1.05rem; display: block; }
.type small { color: var(--muted); display: block; font-size: .8rem; }
.type[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent) inset; }

.q { border-top: 2px dashed var(--line); padding-top: 14px; margin-top: 14px; }
.q.first { border-top: 0; margin-top: 4px; padding-top: 4px; }
.q-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.q-head .num { background: var(--accent); color: #fff; border-radius: 50%; min-width: 34px; height: 34px; display: grid; place-items: center; font-weight: 700; }
.q-head .text { flex: 1; font-size: 1.15rem; font-weight: 700; }
.q-head .tag { font-size: .8rem; font-weight: 400; color: var(--muted); }
.icon-btn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 4px 10px; font-size: 1rem; white-space: nowrap; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chip { border: 2px solid var(--warm); background: var(--warm-soft); border-radius: 999px; padding: 4px 14px; font-size: 1rem; }
.chip:active { transform: scale(.96); }

.answer { display: flex; gap: 8px; align-items: stretch; }
.answer textarea { flex: 1; font: inherit; font-size: 1.15rem; line-height: 1.8; min-height: 110px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; resize: vertical; background: #fffdf9; min-width: 0; }
.q.free .answer textarea { min-height: 240px; }
.mic { width: 78px; border: 3px solid var(--accent); background: var(--accent-soft); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .85rem; font-weight: 700; padding: 6px 4px; }
.mic .m { font-size: 2rem; line-height: 1; }
.mic.on { border-color: var(--rec); background: #fde3e1; color: var(--rec); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(214,54,43,.5); } 50% { box-shadow: 0 0 0 10px rgba(214,54,43,0); } }
.interim { color: var(--muted); font-size: .95rem; min-height: 1.4em; margin: 4px 0 0; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.tools .p { border: 2px solid var(--line); background: var(--card); border-radius: 10px; min-width: 44px; padding: 2px 10px; font-size: 1.1rem; }
.tools .del { font-size: .85rem; color: var(--muted); border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 4px 10px; }
.sos { margin-left: auto; border: 3px solid var(--help); background: var(--help-soft); color: var(--help); border-radius: 999px; padding: 4px 16px; font-weight: 700; }

.help { background: var(--help-soft); border-radius: 12px; padding: 8px 14px; margin-top: 8px; border-left: 6px solid var(--help); }
.help h4 { margin: 0; font-size: .95rem; color: var(--help); }
.help ul { margin: 4px 0; padding-left: 1.3em; }
.help .grp { font-size: .9rem; font-weight: 700; margin-top: 6px; }

details.more { margin-top: 18px; border: 2px dashed var(--accent); border-radius: 14px; padding: 8px 14px; background: #f8fbff; }
details.more > summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: 1.1rem; }
details.example { margin-top: 18px; background: var(--ok-soft); border-radius: 12px; padding: 10px 14px; }
details.example summary { cursor: pointer; font-weight: 700; color: var(--ok); }
details.example p { margin: 8px 0 0; text-indent: 2em; }
.ex-pick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ex-pick button { border: 2px solid var(--ok); background: #fff; border-radius: 999px; padding: 2px 12px; font-size: .9rem; }
.ex-pick button[aria-pressed="true"] { background: var(--ok); color: #fff; }

.para-edit h3 { margin: 14px 0 6px; font-size: 1.05rem; color: var(--accent); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.para-edit textarea { width: 100%; font: inherit; font-size: 1.2rem; line-height: 2; min-height: 140px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 12px; text-indent: 2em; background: #fffdf9; }
.count { font-weight: 700; }
.checklist { list-style: none; padding: 0; margin: 8px 0; }
.checklist li { padding: 4px 0; }
.checklist input { width: 22px; height: 22px; vertical-align: middle; margin-right: 8px; }
.record { width: 100%; border-collapse: collapse; font-size: .9rem; }
.record td, .record th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.btn { border: 0; border-radius: 14px; padding: 12px 20px; font-weight: 700; font-size: 1.05rem; background: var(--accent); color: #fff; }
.btn.secondary { background: var(--card); color: var(--accent); border: 3px solid var(--accent); }
.btn.ok { background: var(--ok); }
.btn.warn { background: var(--card); color: var(--rec); border: 2px solid var(--rec); font-size: .9rem; padding: 8px 14px; }

footer.nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 3px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; gap: 10px; z-index: 10; }
footer.nav .btn { min-width: 130px; font-size: 1.15rem; }
footer.nav .btn[disabled] { opacity: .35; cursor: default; }

.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }

details.teacher { font-size: .9rem; color: var(--muted); }
details.teacher summary { cursor: pointer; }

#printArea { display: none; }

@media (max-width: 560px) {
  body { font-size: 18px; }
  .mic { width: 64px; }
  footer.nav .btn { min-width: 0; flex: 1; }
  .sos { margin-left: 0; }
}

@media print {
  @page { size: A4 portrait; margin: 14mm; }
  body { background: #fff; font-size: 14pt; }
  header.top, nav.steps, main, footer.nav, .toast { display: none !important; }
  #printArea { display: block; color: #000; }
  .p-title { text-align: center; font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", serif; font-size: 22pt; margin: 0 0 4mm; }
  .p-meta { display: flex; justify-content: space-between; font-size: 12pt; margin-bottom: 6mm; border-bottom: 1px solid #000; padding-bottom: 2mm; }
  .p-lined p { font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", serif; font-size: 16pt; line-height: 13mm; text-indent: 2em; margin: 0;
    background-image: linear-gradient(to bottom, transparent calc(13mm - 1px), #999 calc(13mm - 1px)); background-size: 100% 13mm; }
  .p-grid { display: grid; grid-template-columns: repeat(20, 1fr); border-left: 1px solid #555; border-top: 1px solid #555; }
  .p-grid span { aspect-ratio: 1 / 1; border-right: 1px solid #555; border-bottom: 1px solid #555; display: grid; place-items: center;
    font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", serif; font-size: 15pt; break-inside: avoid; }
}
</style>
</head>
<body>
<header class="top">
  <h1>✏️ 作文小幫手：那次，我流下眼淚</h1>
  <span class="save-state" id="saveState">會自動儲存在這台裝置</span>
</header>
<nav class="steps" id="stepNav" aria-label="寫作步驟"></nav>
<main id="main"></main>
<footer class="nav">
  <button class="btn secondary" id="prevBtn">⬅ 上一步</button>
  <button class="btn" id="nextBtn">下一步 ➡</button>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>

<script>
(() => {
const TITLE = '那次，我流下眼淚';
const STORE = 'essay-tears-v1';

/* ================= 內容資料 ================= */
const TYPES = {
  sad:     { e: '😢', name: '難過的眼淚', sub: '失敗、失去、分開',
             events: ['比賽輸了', '考試沒考好', '寵物生病或離開', '和好朋友吵架', '好朋友轉學'] },
  wronged: { e: '😣', name: '委屈的眼淚', sub: '被誤會、被冤枉',
             events: ['被同學誤會', '不是我做的卻被罵', '被別人笑', '東西被弄壞了', '說實話沒人相信'] },
  moved:   { e: '🥹', name: '感動的眼淚', sub: '家人、朋友對我好',
             events: ['生病時家人照顧我', '朋友幫助我', '收到生日驚喜', '阿公阿嬤來看我', '老師鼓勵我'] },
  happy:   { e: '😭🎉', name: '開心的眼淚', sub: '努力很久終於成功',
             events: ['學會騎腳踏車', '比賽得獎', '考試進步了', '終於學會游泳', '表演成功了'] },
  mixed:   { e: '🌀', name: '好幾種心情', sub: '說不清楚，或心情一直變', events: [] }
};

const EXAMPLES = {
  sad: [
    '三年級的運動會，我和同學在操場上參加大隊接力。我們練習了一個多月，比賽前我又緊張又期待，很想幫班上拿到第一名。',
    '比賽開始了，我拿到棒子用力往前跑。沒想到，我的腳一滑，整個人摔在跑道上。我看見其他班的同學一個個超過我，聽見大家「唉——」的聲音。我的心一下子從期待掉到了谷底。',
    '那一刻，我的膝蓋好痛，眼眶也紅了。我趴在跑道上，緊緊咬著嘴唇，眼淚像斷了線的珍珠，一顆一顆掉下來。我小聲地說：「對不起……」心裡想：「都是我害大家輸了。」',
    '我會哭，是因為我覺得對不起同學。後來，好朋友拍拍我的肩膀說：「沒關係，我們明年再一起努力！」我的心慢慢變得溫暖。這次流淚讓我明白了，失敗不可怕，只要不放棄就好。'
  ],
  wronged: [
    '上個星期三，在教室裡，同學的鉛筆盒不見了。本來大家都開開心心地準備上美勞課。',
    '一開始，大家都在找。接著，有一位同學指著我說：「是你拿的吧！」我看見全班都轉頭看我，聽見有人小聲地說話。我的心越跳越快。',
    '那一刻，我的臉一下子變得好燙，喉嚨像被東西卡住，說不出話。我低著頭，眼淚在眼睛裡打轉。我心裡想：「明明不是我，為什麼大家都不相信我？」',
    '我會哭，是因為我覺得好委屈。後來，鉛筆盒在置物櫃找到了，同學也跟我說對不起，我心裡的大石頭終於放下來了。這次流淚讓我明白了，不要隨便誤會別人。'
  ],
  moved: [
    '去年冬天的晚上，我在家裡發高燒，媽媽一直陪在我身邊。那時候我全身不舒服，心情很差。',
    '一開始，我全身發燙、頭好暈。接著，媽媽幫我量體溫、用毛巾幫我擦臉。我看見媽媽的眼睛紅紅的，她整個晚上都沒有睡覺。',
    '第二天早上，我醒來看見媽媽趴在床邊睡著了。那一刻，我的鼻子酸酸的，眼淚忍不住流了下來。我輕輕握住媽媽的手，心想：「媽媽好辛苦，她好愛我。」',
    '我會哭，是因為我被媽媽的愛感動了。後來，我抱著媽媽說：「謝謝妳。」心裡暖暖的。這次流淚讓我明白了，家人的愛是最溫暖的，我也要好好照顧媽媽。'
  ],
  happy: [
    '二年級的暑假，我在公園裡和爸爸一起練習騎腳踏車。一開始我很害怕，一直不敢踩。',
    '我一直摔倒，膝蓋都破皮了。接著，爸爸在後面扶著我，一次又一次地陪我練習。我聽見爸爸說：「加油！你可以的！」我慢慢不那麼害怕了。',
    '那天下午，我終於自己騎了好遠。那一刻，我開心得大叫，眼淚卻一直流下來。我用力揮手，大聲喊：「爸爸，我做到了！」',
    '我會哭，是因為我努力了好久終於成功了。後來，爸爸給了我一個大大的擁抱。這次流淚讓我明白了，只要不放棄，就一定會成功。'
  ]
};

const BANK = [
  { h: '👀 表情（眼睛和臉）', w: ['眼眶紅了', '眼淚在眼睛裡打轉', '淚水像斷了線的珍珠，一顆一顆掉下來', '眼前變得模糊', '眼淚忍不住流了下來', '鼻子酸酸的', '臉一下子變得好燙', '嘴巴扁扁的', '又哭又笑'] },
  { h: '🙌 動作', w: ['肩膀一直發抖', '低著頭不說話', '緊緊咬著嘴唇', '用手擦眼淚', '撲進媽媽的懷裡', '蹲在地上', '轉過身去', '緊緊握住拳頭', '跳了起來'] },
  { h: '🗣️ 說話的樣子', w: ['哽咽地說', '小聲地說', '大聲地喊', '結結巴巴地說', '用顫抖的聲音說', '溫柔地說'] },
  { h: '💗 心裡的感覺', w: ['難過', '委屈', '感動', '開心', '後悔', '溫暖', '驕傲', '害怕', '生氣', '心好像被針刺了一下', '心裡暖暖的', '心裡像有一顆大石頭', '心跳得好快'] },
  { h: '🔄 心情的變化', w: ['本來很期待，後來', '從緊張變成難過', '原本很生氣，後來慢慢平靜下來', '難過慢慢變成了溫暖', '破涕為笑', '心裡輕鬆多了', '心情像坐雲霄飛車'] }
];

/* 每題：core 必寫題、more 擴充題；think=想一想（第1層提示）、s=句子開頭（第2層）、bank=好詞（第3層） */
const STEPS = [
  { id: 'intro', nav: '1 認識題目' },
  { id: 'event', nav: '2 想一件事', emoji: '🤔', title: '想一件讓你流下眼淚的事',
    lead: '先自己想一想：哪一次哭，你到現在還記得很清楚？用寫的或用說的都可以。',
    core: [
      { k: 'event', q: '是什麼事情讓你流下眼淚？', think: ['你什麼時候哭過？是在家裡、學校，還是其他地方？', '哪一次哭，你到現在還記得很清楚？', '可以是難過、委屈、感動，也可以是開心的眼淚喔！'],
        eventIdeas: true }
    ] },
  { id: 'p1', nav: '3 開頭', emoji: '🌱', title: '第一段：開頭（起因）',
    lead: '告訴讀者：這件事在什麼時候、什麼地方、和誰、發生了什麼事。',
    points: ['什麼時候、在哪裡、和誰在一起', '發生了什麼事', '事情發生前，你的心情'],
    core: [
      { k: 'p1a', q: '什麼時候？在哪裡？有誰在？', think: ['那時候你幾年級？是放假、上課，還是特別的日子？', '你在家裡、學校，還是其他地方？', '旁邊有誰陪著你？'],
        s: ['去年暑假，', '三年級的時候，', '有一天放學後，', '我和媽媽', '我和好朋友', '在學校的操場上', '在家裡'] },
      { k: 'p1b', q: '發生了什麼事？', think: ['用一句話說說看，那天發生了什麼事？', '為什麼這件事你到現在還記得？'],
        s: ['那天，', '我們正在', '我要參加', '突然，'] }
    ],
    more: [
      { k: 'p1c', q: '事情發生之前，你的心情怎麼樣？', tag: '心情變化的起點', think: ['那時候你是開心、期待、緊張，還是普通？', '你心裡在想什麼？'],
        s: ['那時候，我心裡', '我很期待', '我有一點緊張，因為'], bank: [3] }
    ],
    order: ['p1a', 'p1b', 'p1c'] },

function save(now) {
  clearTimeout(saveTimer);

    try { localStorage.setItem(STORE, JSON.stringify(state)); $('saveState').textContent = '✅ 已自動儲存 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }); }
    catch (e) { $('saveState').textContent = '⚠️ 這台裝置無法自動儲存，請記得下載'; }
  };
  now ? go() : (saveTimer = setTimeout(go, 400));
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }

/* ================= 朗讀 ================= */
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('這個瀏覽器不能朗讀'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW'; u.rate = 0.85;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ================= 語音輸入 ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recTa = null;
function stopRec() { if (rec) { try { rec.stop(); } catch (e) {} } }
function startRec(btn, ta) {
  if (!SR) {
    alert('這個瀏覽器不支援網頁語音輸入。\n\n請改用：\n・電腦：Chrome 或 Edge 瀏覽器\n・iPad／手機：點一下文字框，再按鍵盤上的 🎤 麥克風鍵說話');
    ta.focus(); return;
  }
  if (rec) { const same = recTa === ta; stopRec(); if (same) return; }
  const r = new SR();
  r.lang = 'zh-TW'; r.continuous = true; r.interimResults = true;
  const interimEl = ta.closest('[data-box]').querySelector('.interim');
  const label = btn.querySelector('.l') || btn;
  const orig = label.textContent;
  rec = r; recTa = ta;
  btn.classList.add('on'); label.textContent = '說完按我';
  interimEl.textContent = '🎙️ 請開始說話…';
  r.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const res = ev.results[i];
      if (res.isFinal) insertText(ta, res[0].transcript.replace(/\s+/g, ''));
      else interim += res[0].transcript;
    }
    interimEl.textContent = interim ? '🎙️ ' + interim : '🎙️ 繼續說，或按「說完按我」';
  };
  r.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') alert('沒有麥克風權限。請在瀏覽器網址列旁邊允許使用麥克風，再試一次。');
    else if (ev.error === 'no-speech') toast('沒有聽到聲音，再試一次');
    else if (ev.error !== 'aborted') toast('語音輸入出了問題：' + ev.error);
  };
  r.onend = () => {
    btn.classList.remove('on'); label.textContent = orig === '說完按我' ? '按我說話' : orig;
    interimEl.textContent = '';
    if (rec === r) { rec = null; recTa = null; }
  };
  try { r.start(); } catch (e) { r.onend(); toast('請再按一次麥克風'); }
}

/* ================= 插入文字 ================= */
let lastTa = null;
function insertText(ta, text) {
  const useCursor = document.activeElement === ta || ta._hadFocus;
  const s = useCursor ? ta.selectionStart : ta.value.length, e = useCursor ? ta.selectionEnd : ta.value.length;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  const pos = s + text.length;
  ta.setSelectionRange(pos, pos);
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

/* ================= 組合段落 ================= */
function endPunct(s) {
  s = (s || '').trim();
  if (!s) return '';
  return /[。！？」…～]$/.test(s) ? s : s.replace(/[，、；：,]$/, '') + '。';
}
function guidedText(st) { return st.order.map(k => endPunct(state.ans[k])).join(''); }
function paraText(st) { return state.mode[st.id] === 'free' ? (state.ans['free_' + st.id] || '').trim() : guidedText(st); }
function buildParas() { return PARA_STEPS.map(paraText); }
function essayText() { return (state.paras || buildParas()).map(p => p.trim()).filter(Boolean); }
function countChars(arr) { return arr.join('').replace(/\s/g, '').length; }
function stepHasText(st) {
  if (st.id === 'intro') return !!state.name;
  if (st.order) return !!paraText(st);
  if (st.core) return st.core.some(q => (state.ans[q.k] || '').trim());
  return false;
}

    let body;
    if (free) {
      body = `<div class="tip">✍️ 這段可以寫：${st.points.map(p => `「${esc(p)}」`).join('、')}。<br>不用全部都寫，也可以寫更多你想寫的！</div>
        ${qHtml(freeQ(st), '✍️', { first: true, free: true })}`;
    } else {
      let n = 0;
      body = st.core.map((q, i) => qHtml(q, ++n, { first: i === 0 })).join('') +
        (st.more ? `<details class="more" data-more="${st.id}" ${state.moreOpen[st.id] ? 'open' : ''}><summary>➕ 我還想寫更多（可以不寫）</summary>
          ${st.more.map((q, i) => qHtml(q, ++n, { first: i === 0 })).join('')}</details>` : '');
    }
    h = `<section class="card">
      <h2 class="step-title"><span class="emoji">${st.emoji}</span>${st.title}</h2>
      <p class="lead">${st.lead} <button class="icon-btn" data-speak="${esc(st.title + '。' + st.lead)}">🔊</button></p>
      ${ev ? `<div class="tip">📌 我要寫的事：<b>${esc(ev)}</b></div>` : ''}
      <div class="mode-switch">
        <button data-mode="guided" aria-pressed="${!free}">🧩 一題一題回答</button>
        <button data-mode="free" aria-pressed="${free}">✍️ 我想自己寫這一段</button>
      </div>
      ${body}
      ${exampleHtml(st, idx)}
    </section>`;
  } else if (st.id === 'final') {
    const fresh = buildParas();
    if (!state.paras) { state.paras = fresh; state.parasSrc = JSON.stringify(fresh); }
    else if (JSON.stringify(fresh) !== state.parasSrc) {
      const editedHere = JSON.stringify(state.paras) !== state.parasSrc;
      if (!editedHere || confirm('前面步驟的內容改過了，要更新這篇作文嗎？\n按「取消」會保留你在這一頁改過的內容。')) {
        state.paras = fresh; toast('作文已經更新');
      }
      state.parasSrc = JSON.stringify(fresh);
    }
    const empty = state.paras.every(p => !p.trim());
    h = `<section class="card">
      <h2 class="step-title"><span class="emoji">🎉</span>完成作文！</h2>
      <p class="lead">小幫手把你寫的內容組合成一篇作文了。讀一讀，想怎麼改都可以：加句子、換詞語、調整順序都沒問題！</p>
      ${empty ? '<div class="tip">⚠️ 還沒有內容喔！請回到前面的步驟寫寫看。</div>' : ''}
      <div class="topic-box" style="padding:10px"><p class="t" style="font-size:1.6rem">${TITLE}</p><p style="margin:0">${esc(state.name || '')}</p></div>
      <div class="para-edit">${state.paras.map((p, i) => `<div class="para-edit-item" data-box="para${i}"><h3>${PARA_STEPS[i] ? PARA_STEPS[i].emoji : '✨'} 第${'一二三四五六七八九十'[i] || i + 1}段
        <button class="icon-btn" data-mic-para="${i}" style="font-size:.85rem"><span class="l">🎤 用說的加句子</span></button></h3>
        <textarea data-para="${i}">${esc(p)}</textarea><p class="interim"></p></div>`).join('')}</div>
      <p>全文共 <span class="count" id="charCount">${countChars(state.paras)}</span> 字</p>
      <div class="actions">
        <button class="btn secondary" id="readAll">🔊 唸整篇給我聽</button>
        <button class="btn secondary" id="addPara">➕ 加一段</button>
        <button class="btn secondary" id="rebuild">🔄 重新從前面的回答組合</button>
      </div>
    </section>
    <section class="card">
      <h2 class="step-title" style="font-size:1.3rem">✅ 自己檢查一下</h2>
      <ul class="checklist">${['我有寫出什麼時候、在哪裡、發生什麼事', '我有按照順序寫出事情的經過', '我有寫出流淚時的表情或動作', '我有寫出說的話或心裡的想法', '我有寫出心情的變化（之前→流淚時→之後）', '我有寫出「為什麼哭」', '我有寫出「這次流淚讓我明白了什麼」']
        .map((c, i) => `<li><label><input type="checkbox" data-check="${i}" ${state.checks[i] ? 'checked' : ''}>${c}</label></li>`).join('')}</ul>
      <p style="font-size:.9rem;color:var(--muted)">還沒寫到的，可以點上面的步驟回去補，或直接在這頁加上去。</p>
    </section>
    <section class="card">
      <h2 class="step-title" style="font-size:1.3rem">🖨️ 儲存與列印</h2>
      <div class="actions">
        <button class="btn ok" data-print="lined">🖨️ 列印（橫線紙）</button>
        <button class="btn ok" data-print="grid">🖨️ 列印（稿紙格子）</button>
        <button class="btn secondary" id="dlDoc">💾 下載 Word 檔</button>
        <button class="btn secondary" id="dlTxt">💾 下載文字檔</button>
        <button class="btn secondary" id="saveNow">📌 儲存</button>
      </div>
      <p style="font-size:.9rem;color:var(--muted)">想存成 PDF：按「列印」後，印表機選「另存為 PDF」。</p>
      <div class="actions"><button class="btn warn" id="resetAll">🗑️ 開始新的作文（清除全部）</button></div>
    </section>
    <details class="teacher card"><summary>👩‍🏫 提示使用紀錄（給老師）</summary>${recordHtml()}</details>`;
  }
  $('main').innerHTML = h;
  renderNav();
  window.scrollTo(0, 0);
}

function recordRows() {
  const rows = [];
  STEPS.filter(s => s.core).forEach(st => {
    const free = state.mode[st.id] === 'free';
    const qs = free ? [freeQ(st)] : [...st.core, ...(st.more || [])];
    const items = qs.filter(q => (state.ans[q.k] || '').trim() || state.help[q.k])
      .map(q => `${free ? '自由寫作' : q.q.replace(/[？?].*$/, '？')}：${HELP_NAMES[state.help[q.k] || 0]}${(state.ans[q.k] || '').trim() ? '' : '（未作答）'}`);
    const moreUsed = !free && (st.more || []).filter(q => (state.ans[q.k] || '').trim()).length;
    rows.push({ step: st.nav.replace(/^\d\s/, ''), mode: st.order ? (free ? '✍️ 自己寫' : '🧩 逐題') : '', items, more: moreUsed, ex: !!state.exOpened[st.id] });
  });
  return rows;
}
function recordHtml() {
  return `<table class="record"><tr><th>段落</th><th>方式</th><th>各題提示層級</th><th>擴充題</th><th>看範例</th></tr>${recordRows().map(r =>
    `<tr><td>${r.step}</td><td>${r.mode}</td><td>${r.items.map(esc).join('<br>') || '—'}</td><td>${r.more ? r.more + ' 題' : '—'}</td><td>${r.ex ? '有' : '—'}</td></tr>`).join('')}</table>
    <p>提示層級：自己完成 → 💭 想一想 → ✏️ 句子開頭 → 💎 好詞</p>`;
}

/* ================= 列印與下載 ================= */
function gridRows(text) {
  const chars = Array.from('　　' + text);
  const rows = [];
  for (let i = 0; i < chars.length; i += 20) rows.push(chars.slice(i, i + 20));
  if (rows.length) while (rows[rows.length - 1].length < 20) rows[rows.length - 1].push('');
  return rows;
}
function doPrint(mode) {
  const paras = essayText();
  if (!paras.length) { toast('還沒有內容可以列印'); return; }
  const date = new Date().toLocaleDateString('zh-TW');
  const meta = `<div class="p-meta"><span>姓名：${esc(state.name || '＿＿＿＿＿＿')}</span><span>字數：${countChars(paras)} 字</span><span>日期：${date}</span></div>`;
  let body;
  if (mode === 'grid') {
    const rows = [];
    paras.forEach(p => rows.push(...gridRows(p)));
    const minRows = Math.max(rows.length + 2, 20);
    while (rows.length < minRows) rows.push(Array(20).fill(''));
    body = `<div class="p-grid">${rows.flat().map(c => `<span>${esc(c)}</span>`).join('')}</div>`;
  } else {
    body = `<div class="p-lined">${paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
  }
  $('printArea').innerHTML = `<h1 class="p-title">${TITLE}</h1>${meta}${body}`;
  setTimeout(() => window.print(), 50);
}
function download(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function fileBase() { return `${TITLE.replace(/，/g, '_')}_${state.name || '作文'}`; }
function dlTxt() {
  const paras = essayText();
  download(fileBase() + '.txt', '﻿' + `${TITLE}\n姓名：${state.name}\n\n` + paras.map(p => '　　' + p).join('\n\n') + '\n', 'text/plain;charset=utf-8');
}
function dlDoc() {
  const paras = essayText();
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${TITLE}</title>
    <style>body{font-family:"標楷體","DFKai-SB",serif;font-size:16pt;line-height:2}h1{text-align:center;font-size:22pt}p{text-indent:2em;margin:0 0 6pt}</style></head>
    <body><h1>${TITLE}</h1><p style="text-indent:0">姓名：${esc(state.name)}</p>${paras.map(p => `<p>${esc(p)}</p>`).join('')}</body></html>`;
  download(fileBase() + '.doc', '﻿' + html, 'application/msword');
}

/* ================= 事件 ================= */
function go(n) { state.step = Math.max(0, Math.min(STEPS.length - 1, n)); save(true); render(); }
$('prevBtn').onclick = () => go(state.step - 1);
$('nextBtn').onclick = () => go(state.step + 1);

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.go !== undefined) go(+d.go);
  else if (d.speak) speak(d.speak);
  else if (d.type) { state.type = state.type === d.type ? '' : d.type; save(); document.querySelectorAll('.type').forEach(t => t.setAttribute('aria-pressed', t.dataset.type === state.type)); }
  else if (d.sos) { state.help[d.sos] = (state.help[d.sos] || 0) + 1; save(); rerenderQ(d.sos); const q = ALL_Q[d.sos]; if (q && state.help[d.sos] === 1) speak('想一想。' + q.think.join('')); }
  else if (d.mode) {
    const st = STEPS[state.step];
    if (d.mode === 'free' && !(state.ans['free_' + st.id] || '').trim()) state.ans['free_' + st.id] = guidedText(st);
    state.mode[st.id] = d.mode; save(); stopRec();
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  else if (d.extype) { state.exType = d.extype; save(); const det = b.closest('details'); const tmp = document.createElement('div'); tmp.innerHTML = exampleHtml(STEPS[state.step], PARA_STEPS.indexOf(STEPS[state.step])); tmp.firstElementChild.open = true; det.replaceWith(tmp.firstElementChild); }
  else if (d.ins !== undefined) {
    const ta = $('ta-' + d.target);
    if (!ta) return;
    insertText(ta, d.ins); ta.focus({ preventScroll: true });
  }
  else if (d.undo) {
    const ta = $('ta-' + d.undo);
    const pos = ta._hadFocus ? ta.selectionStart : ta.value.length;
    if (pos > 0) { const chars = Array.from(ta.value.slice(0, pos)); chars.pop(); const before = chars.join(''); ta.value = before + ta.value.slice(pos); ta.setSelectionRange(before.length, before.length); ta.dispatchEvent(new Event('input', { bubbles: true })); }
  }
  else if (d.mic) startRec(b, $('ta-' + d.mic));
  else if (d.micPara !== undefined) startRec(b, document.querySelector(`textarea[data-para="${d.micPara}"]`));
  else if (d.print) doPrint(d.print);
  else if (b.id === 'readAll') speak(TITLE + '。' + essayText().join(''));
  else if (b.id === 'addPara') { state.paras.push(''); save(); const y = window.scrollY; render(); window.scrollTo(0, y); const tas = document.querySelectorAll('textarea[data-para]'); tas[tas.length - 1].focus(); }
  else if (b.id === 'rebuild') { if (confirm('要用前面步驟的內容重新組合嗎？在這一頁改過的內容會不見。')) { state.paras = null; save(true); render(); } }
  else if (b.id === 'dlTxt') dlTxt();
  else if (b.id === 'dlDoc') dlDoc();
  else if (b.id === 'saveNow') { save(true); toast('已儲存在這台裝置 ✅'); }
  else if (b.id === 'resetAll') {
    if (confirm('確定要清除全部內容，開始新的作文嗎？\n（建議先下載或列印）')) { state = blank(); save(true); render(); toast('已清除，可以開始新的作文'); }
  }
});
document.addEventListener('mousedown', e => { if (e.target.closest('.chip, .tools .p')) e.preventDefault(); }); // 點詞語時保留游標位置
document.addEventListener('toggle', e => {
  const t = e.target;
  if (t.dataset && t.dataset.more) { state.moreOpen[t.dataset.more] = t.open; save(); }
  if (t.dataset && t.dataset.ex && t.open) { state.exOpened[t.dataset.ex] = true; save(); }
}, true);
document.addEventListener('focusin', e => { if (e.target.matches('textarea')) { lastTa = e.target; e.target._hadFocus = true; } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.k) state.ans[t.dataset.k] = t.value;
  else if (t.id === 'nameInput') state.name = t.value;
  else if (t.dataset.para !== undefined) { state.paras[+t.dataset.para] = t.value; const c = $('charCount'); if (c) c.textContent = countChars(state.paras); }
  else return;
  save();
});
document.addEventListener('change', e => { if (e.target.dataset.check !== undefined) { state.checks[e.target.dataset.check] = e.target.checked; save(); } });
window.addEventListener('afterprint', () => { $('printArea').innerHTML = ''; });
if ('speechSynthesis' in window) speechSynthesis.getVoices();

render();
})();
</script>
</body>
</html>
