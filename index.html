<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級點餐系統</title>

  <!-- 載入 Tailwind CSS (負責畫面排版與美化) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 載入 React 與 ReactDOM (負責網頁互動邏輯) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- 載入 Babel (讓瀏覽器能看懂 React 語法) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 隱藏卷軸但保留滑動功能 */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 淡入動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50">
  <!-- React 應用程式的掛載點 -->
  <div id="root"></div>

  <!-- 系統核心邏輯 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 圖示元件 (全內建，不依賴外部圖示庫) ---
    const Settings = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
    const ClipboardList = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>;
    const PieChart = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;
    const Plus = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    const Trash2 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
    const Upload = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
    const Check = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
    const AlertCircle = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
    const Loader2 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>;
    const Utensils = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>;
    const GripVertical = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>;
    const ImageIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>;
    const LinkIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>;
    const MapPin = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;

    // --- 餐點圖片 (載入失敗時顯示預設圖示) ---
    const ItemImage = ({ src, className }) => {
      const [failed, setFailed] = useState(false);
      useEffect(() => setFailed(false), [src]);
      if (!src || failed) {
        return (
          <div className={`${className} bg-slate-100 flex items-center justify-center text-slate-300`}>
            <ImageIcon className="w-1/2 h-1/2" />
          </div>
        );
      }
      return <img src={src} alt="" referrerPolicy="no-referrer" className={`${className} object-cover`} onError={() => setFailed(true)} />;
    };

    // 測試圖片網址是否真的能載入 (避免 AI 給出失效連結)
    const canLoadImage = (url) => new Promise(resolve => {
      const img = new Image();
      const timer = setTimeout(() => resolve(false), 8000);
      img.referrerPolicy = 'no-referrer';
      img.onload = () => { clearTimeout(timer); resolve(img.naturalWidth > 0); };
      img.onerror = () => { clearTimeout(timer); resolve(false); };
      img.src = url;
    });

    // 從 AI 回覆中取出 JSON 物件 (使用搜尋功能時無法強制 JSON 格式)
    const extractJson = (text) => {
      const start = text.indexOf('{');
      const end = text.lastIndexOf('}');
      if (start === -1 || end <= start) return null;
      try {
        return JSON.parse(text.slice(start, end + 1));
      } catch {
        return null;
      }
    };

    // 將上傳的圖片縮小，避免佔用太多記憶體
    const resizeImageFile = (file, maxSize = 256) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    function App() {
      const [activeTab, setActiveTab] = useState('setup');
      const [apiKey, setApiKey] = useState(localStorage.getItem('geminiApiKey') || '');

      // --- 產生預設的班級名單 (101~608) ---
      const generateClassList = () => {
        const list = [];
        for (let grade = 1; grade <= 6; grade++) {
          for (let cls = 1; cls <= 8; cls++) {
            list.push(`${grade}0${cls}`);
          }
        }
        return list;
      };
      const defaultClasses = generateClassList();

      // State: Setup (預設帶入 101~608 班級名單)
      const [studentInput, setStudentInput] = useState(defaultClasses.join('\n'));
      const [students, setStudents] = useState(defaultClasses);
      const [menuItems, setMenuItems] = useState([
        { id: '1', category: '麵食類', name: '肉麻麵 (細麵)', price: 65 },
        { id: '2', category: '麵食類', name: '肉麻麵 (意麵)', price: 65 },
        { id: '3', category: '飲品', name: '紅茶', price: 25 }
      ]);
      const [isParsingMenu, setIsParsingMenu] = useState(false);
      const [menuError, setMenuError] = useState('');
      const [dragState, setDragState] = useState(null); // { id, name, x, y, target }

      // State: 餐點圖片搜尋
      const [plusCode, setPlusCode] = useState('');
      const [restaurantInfo, setRestaurantInfo] = useState(null);
      const [isFindingImages, setIsFindingImages] = useState(false);
      const [imageStatus, setImageStatus] = useState('');
      const [imageError, setImageError] = useState('');
      const [mapsApiKey, setMapsApiKey] = useState(localStorage.getItem('mapsApiKey') || '');
      const [placePhotos, setPlacePhotos] = useState([]); // [{ uri, authors }]

      // State: Ordering
      const [currentStudent, setCurrentStudent] = useState('');
      const [orders, setOrders] = useState({}); // { studentName: { itemId: quantity } }
      const [currentCart, setCurrentCart] = useState({});

      const handleApiKeyChange = (e) => {
        setApiKey(e.target.value);
        localStorage.setItem('geminiApiKey', e.target.value);
      };

      // 處理學生名單輸入
      const handleStudentInputChange = (e) => {
        setStudentInput(e.target.value);
        const parsedStudents = e.target.value
          .split('\n')
          .map(s => s.trim())
          .filter(s => s !== '');
        setStudents(parsedStudents);
      };

      // 手動新增菜單品項
      const addMenuItem = (category = '未分類') => {
        setMenuItems([...menuItems, { id: Date.now().toString(), category, name: '', price: 0 }]);
      };

      // 批次更新分類名稱
      const updateCategoryName = (oldCategory, newCategory) => {
        const trimmedNew = newCategory.trim() || '未分類';
        if (oldCategory === trimmedNew) return;
        setMenuItems(prev => prev.map(item =>
          (item.category || '未分類') === oldCategory ? { ...item, category: trimmedNew } : item
        ));
      };

      // 更新單一菜單品項
      const updateMenuItem = (id, field, value) => {
        setMenuItems(prev => prev.map(item =>
          item.id === id ? { ...item, [field]: field === 'price' ? Number(value) : value } : item
        ));
      };

      // 移動菜單品項 (拖曳排序，也可移到其他分類)
      const moveMenuItem = (dragId, target) => {
        setMenuItems(prev => {
          const dragged = prev.find(m => m.id === dragId);
          if (!dragged || target.itemId === dragId) return prev;
          const moved = { ...dragged, category: target.category };
          const rest = prev.filter(m => m.id !== dragId);
          let index;
          if (target.itemId) {
            index = rest.findIndex(m => m.id === target.itemId) + (target.after ? 1 : 0);
          } else {
            // 放在分類空白處：排到該分類最後一項
            const last = rest.map(m => m.category || '未分類').lastIndexOf(target.category);
            index = last === -1 ? rest.length : last + 1;
          }
          rest.splice(index, 0, moved);
          return rest;
        });
      };

      // 開始拖曳 (用 pointer 事件，滑鼠與手機觸控都能用)
      const startDrag = (e, item) => {
        e.preventDefault();
        setDragState({ id: item.id, name: item.name || '(未命名)', x: e.clientX, y: e.clientY, target: null });
      };

      useEffect(() => {
        if (!dragState) return;
        const dragId = dragState.id;

        const findTarget = (x, y) => {
          const el = document.elementFromPoint(x, y);
          const itemEl = el?.closest('[data-drop-item]');
          if (itemEl) {
            const rect = itemEl.getBoundingClientRect();
            return { itemId: itemEl.dataset.dropItem, category: itemEl.dataset.category, after: y > rect.top + rect.height / 2 };
          }
          const categoryEl = el?.closest('[data-drop-category]');
          return categoryEl ? { category: categoryEl.dataset.dropCategory } : null;
        };

        const onMove = (e) => {
          // 拖到畫面邊緣時自動捲動
          if (e.clientY < 80) window.scrollBy(0, -12);
          else if (e.clientY > window.innerHeight - 80) window.scrollBy(0, 12);
          setDragState(s => s && { ...s, x: e.clientX, y: e.clientY, target: findTarget(e.clientX, e.clientY) });
        };
        const onUp = (e) => {
          const target = findTarget(e.clientX, e.clientY);
          if (target) moveMenuItem(dragId, target);
          setDragState(null);
        };
        const onCancel = () => setDragState(null);

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onCancel);
        return () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onCancel);
        };
      }, [dragState?.id]);

      // 手動上傳單一品項圖片
      const handleItemImageUpload = async (id, e) => {
        const file = e.target.files[0];
        e.target.value = null;
        if (!file) return;
        try {
          updateMenuItem(id, 'image', await resizeImageFile(file));
        } catch {
          alert('圖片讀取失敗，請再試一次。');
        }
      };

      // 手動貼上單一品項圖片網址
      const promptItemImageUrl = (id) => {
        const url = window.prompt('請貼上圖片網址（留空則移除圖片）：', '');
        if (url === null) return;
        const trimmed = url.trim();
        if (trimmed && !/^https?:\/\//.test(trimmed)) {
          alert('圖片網址必須以 http:// 或 https:// 開頭');
          return;
        }
        updateMenuItem(id, 'image', trimmed);
      };

      // 呼叫 Gemini API，回傳文字內容
      const callGemini = async (parts, { json = false, search = false } = {}) => {
        const payload = { contents: [{ role: "user", parts }] };
        if (json) payload.generationConfig = { responseMimeType: "application/json" };
        if (search) payload.tools = [{ google_search: {} }];

        // 使用穩定的正式版模型 (gemini-2.5-flash)
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.error) {
          throw new Error(result.error.message || 'API 呼叫失敗，請檢查 API Key 是否正確。');
        }

        return (result.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
      };

      // 針對 GCP API 未啟用的錯誤提供明確的中文提示
      const friendlyError = (error, fallback) => {
        const message = error?.message || '';
        if (message.includes("has not been used in project") || message.includes("is disabled")) {
          return "您的 API Key 尚未啟用 Generative Language API。請至 Google Cloud Console 啟用，或直接到 Google AI Studio 免費申請一把新的 Key。";
        }
        return message || fallback;
      };

      // --- Google 地圖 (Places API) ---
      const PLACE_FIELD_MASK = ['id', 'displayName', 'formattedAddress', 'location', 'types', 'photos', 'googleMapsUri', 'websiteUri']
        .map(f => `places.${f}`).join(',');
      const isFoodPlace = (place) => (place.types || []).some(t =>
        ['restaurant', 'food', 'cafe', 'meal_takeaway', 'meal_delivery', 'bakery'].includes(t) || t.endsWith('_restaurant'));

      const placesRequest = async (path, body) => {
        const response = await fetch(`https://places.googleapis.com/v1/${path}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': mapsApiKey, 'X-Goog-FieldMask': PLACE_FIELD_MASK },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        if (result.error) throw new Error(`Google 地圖 API：${result.error.message}`);
        return result.places || [];
      };

      // Plus Code 本身只是座標，先找到該位置，再找最近的餐廳
      const findRestaurantByPlusCode = async (code) => {
        const places = await placesRequest('places:searchText', { textQuery: code, languageCode: 'zh-TW' });
        const direct = places.find(isFoodPlace);
        if (direct) return direct;
        if (!places[0]?.location) return null;
        const nearby = await placesRequest('places:searchNearby', {
          includedTypes: ['restaurant', 'cafe', 'meal_takeaway', 'bakery'],
          maxResultCount: 5,
          rankPreference: 'DISTANCE',
          languageCode: 'zh-TW',
          locationRestriction: { circle: { center: places[0].location, radius: 50 } }
        });
        return nearby[0] || null;
      };

      const getPhotoUri = async (photoName) => {
        const response = await fetch(`https://places.googleapis.com/v1/${photoName}/media?maxWidthPx=480&skipHttpRedirect=true&key=${mapsApiKey}`);
        const result = await response.json();
        return result.photoUri || null;
      };

      // 下載照片給 AI 辨識；若瀏覽器擋下 (跨網域限制) 則回傳 null
      const photoToBase64 = async (uri) => {
        try {
          const blob = await (await fetch(uri)).blob();
          return (await resizeImageFile(blob, 384)).split(',')[1];
        } catch {
          return null;
        }
      };

      // 為品項套用找到的圖片 (已經有圖片的品項不覆蓋)
      const applyFoundImages = (found, total) => {
        setMenuItems(prev => prev.map(item => (!item.image && found[item.id]) ? { ...item, image: found[item.id] } : item));
        const count = Object.keys(found).length;
        return count > 0
          ? `已為 ${count} / ${total} 個品項配上圖片。`
          : "沒有自動配對到餐點圖片。";
      };

      // 方法一：用 Google 地圖取得餐廳照片，再讓 AI 看照片判斷是哪道菜
      const findImagesWithMaps = async (namedItems) => {
        const place = await findRestaurantByPlusCode(plusCode.trim());
        if (!place) throw new Error("在這個 Plus Code 附近找不到餐廳，請確認 Plus Code 是否正確。");

        setRestaurantInfo({
          name: place.displayName?.text,
          address: place.formattedAddress,
          website: place.websiteUri,
          mapsUri: place.googleMapsUri
        });

        const photos = (await Promise.all((place.photos || []).map(async photo => {
          const uri = await getPhotoUri(photo.name);
          return uri ? { uri, authors: (photo.authorAttributions || []).map(a => a.displayName).filter(Boolean) } : null;
        }))).filter(Boolean);
        setPlacePhotos(photos);
        if (photos.length === 0) return "找到餐廳，但 Google 地圖沒有提供照片。";

        // 讓 Gemini 看照片，判斷每張照片是哪個品項
        const withData = (await Promise.all(photos.map(async p => ({ ...p, data: await photoToBase64(p.uri) })))).filter(p => p.data);
        if (withData.length === 0 || !apiKey) {
          return `找到 ${photos.length} 張餐廳照片，請在下方照片選擇要套用到哪個品項。`;
        }

        const itemList = namedItems.map(m => `- id: ${m.id}，名稱：${m.name}`).join('\n');
        const parts = [{ text: `以下是一間餐廳在 Google 地圖上的照片，依序編號為照片 0 到照片 ${withData.length - 1}。
請判斷每張照片中的餐點，最符合下列哪個菜單品項。只有在很確定時才配對；菜單照片、店面照片或無法判斷的照片請略過。每個品項最多配一張照片。
菜單品項：
${itemList}

只回傳 JSON 陣列，格式：[{"id": "品項 id", "photo": 照片編號}]，沒有任何配對就回傳 []。` }];
        withData.forEach((p, i) => {
          parts.push({ text: `照片 ${i}：` });
          parts.push({ inlineData: { mimeType: 'image/jpeg', data: p.data } });
        });

        const matches = JSON.parse(await callGemini(parts, { json: true }));
        const validIds = new Set(namedItems.map(m => m.id));

        (Array.isArray(matches) ? matches : []).forEach(m => {
          const photo = withData[Number(m?.photo)];
          if (photo && validIds.has(String(m.id))) found[String(m.id)] = photo.uri;

        return `${applyFoundImages(found, namedItems.length)} 共找到 ${photos.length} 張餐廳照片，也可以在下方照片手動指定品項。`;

      // 方法二：沒有 Google 地圖金鑰時，用 Gemini + Google 搜尋找網路上的圖片
      const findImagesWithSearch = async (namedItems) => {

請使用 Google 搜尋找出位於這個位置的餐廳，以及它的官方網站、Google 地圖、外送平台 (Uber Eats、foodpanda) 或社群網站上的餐點照片。
接著為下列每個菜單品項，找出最符合的餐點照片「直接圖片網址」(必須是可直接開啟的圖片連結，例如 .jpg、.png、.webp 結尾或圖片 CDN 網址，不能是網頁連結)。
找不到的品項 imageUrl 請填空字串，不要自行編造網址。
菜單品項：
${itemList}

只回傳下列格式的 JSON，不要任何其他文字：
{"restaurant": {"name": "餐廳名稱", "address": "地址", "website": "網址"}, "images": [{"id": "品項 id", "imageUrl": "圖片網址"}]}`;

        const text = await callGemini([{ text: prompt }], { search: true });
        const data = extractJson(text);
        if (!data) throw new Error("無法解析 AI 回傳的內容，請再試一次。");

        setRestaurantInfo(data.restaurant || null);

        // 只保留真的能載入的圖片
        const candidates = (data.images || []).filter(i => i && i.id && /^https?:\/\//.test(i.imageUrl || ''));
        const checked = await Promise.all(candidates.map(async c => (await canLoadImage(c.imageUrl)) ? c : null));
        const found = Object.fromEntries(checked.filter(Boolean).map(c => [String(c.id), c.imageUrl]));

          try {
            const base64Image = reader.result.split(',')[1];

            範例：[{"category": "飯麵類", "name": "排骨飯", "price": 90}, {"category": "飲品", "name": "珍奶", "price": 50}]`;

            const text = await callGemini([
              { text: prompt },
              { inlineData: { mimeType: file.type, data: base64Image } }

                      onChange={(e) => { setMapsApiKey(e.target.value); localStorage.setItem('mapsApiKey', e.target.value); }}
                      placeholder="在此貼上 Google 地圖 API Key..."
                      className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
                    />
                    <div className="mt-1 text-xs text-slate-400">
                      需在 Google Cloud 啟用「Places API (New)」：<a href="https://console.cloud.google.com/google/maps-apis/credentials" target="_blank" rel="noreferrer" className="text-indigo-500 hover:underline">點此前往申請</a>
                    </div>
                  </div>
                  <div className="flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      value={plusCode}
                      onChange={(e) => setPlusCode(e.target.value)}
                      placeholder="在此貼上 Plus Code..."
                      className="flex-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                    <button
                      onClick={handleFindImages}
                      disabled={isFindingImages}
                      className={`px-5 py-3 rounded-xl font-semibold flex items-center justify-center gap-2 transition-colors ${isFindingImages ? 'bg-slate-200 text-slate-500 cursor-wait' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
                    >
                      {isFindingImages ? (
                        <><Loader2 className="w-5 h-5 animate-spin" /> 搜尋中...</>
                      ) : (
                        <><ImageIcon className="w-5 h-5" /> 搜尋餐點圖片</>
                      )}
                    </button>
                  </div>
                  {plusCode.trim() && (
                    <a
                      href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(plusCode.trim())}`}
                      target="_blank"
                      rel="noreferrer"
                      className="mt-2 inline-flex items-center gap-1 text-xs text-indigo-500 hover:underline"
                    >
                      <MapPin className="w-3.5 h-3.5" /> 在 Google 地圖確認位置
                    </a>
                  )}
                  {restaurantInfo?.name && (
                    <div className="mt-3 p-3 bg-slate-50 rounded-xl text-sm">
                      <div className="font-bold text-slate-700">🍽️ {restaurantInfo.name}</div>
                      {restaurantInfo.address && <div className="text-slate-500">{restaurantInfo.address}</div>}
                      {/^https?:\/\//.test(restaurantInfo.website || '') && (
                        <a href={restaurantInfo.website} target="_blank" rel="noreferrer" className="block text-indigo-500 hover:underline break-all">{restaurantInfo.website}</a>
                      )}
                      {/^https?:\/\//.test(restaurantInfo.mapsUri || '') && (
                        <a href={restaurantInfo.mapsUri} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 text-indigo-500 hover:underline">
                          <MapPin className="w-3.5 h-3.5" /> 在 Google 地圖查看
                        </a>
                      )}
                    </div>
                  )}
                  {imageStatus && (
                    <div className="mt-3 text-sm text-emerald-600 flex items-center gap-1">
                      <Check className="w-4 h-4 shrink-0" /> {imageStatus}
                    </div>
                  )}
                  {imageError && (
                    <div className="mt-3 text-sm text-red-500 flex items-center gap-1">
                      <AlertCircle className="w-4 h-4 shrink-0" /> {imageError}
                    </div>
                  )}

                  {/* Google 地圖上的餐廳照片，可手動指定給品項 */}
                  {placePhotos.length > 0 && (
                    <div className="mt-4">
                      <p className="text-sm font-semibold text-slate-700 mb-2">餐廳照片（選擇品項即可套用）</p>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        {placePhotos.map((photo) => (
                          <div key={photo.uri} className="border border-slate-200 rounded-xl overflow-hidden bg-white">
                            <ItemImage src={photo.uri} className="w-full aspect-square" />
                            <div className="p-2 space-y-1">
                              <select
                                value={menuItems.find(m => m.image === photo.uri)?.id || ''}
                                onChange={(e) => e.target.value && updateMenuItem(e.target.value, 'image', photo.uri)}
                                className="w-full p-1.5 text-sm border border-slate-200 rounded-lg bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500"
                              >
                                <option value="">套用到品項...</option>
                                {menuItems.filter(m => m.name.trim() !== '').map(m => (
                                  <option key={m.id} value={m.id}>{m.name}</option>
                                ))}
                              </select>
                              {photo.authors.length > 0 && (
                                <div className="text-[10px] text-slate-400 truncate">照片：{photo.authors.join('、')} / Google 地圖</div>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* =========================================
                Tab 2: 進行點餐
               ========================================= */}
            {activeTab === 'order' && (
              <div className="space-y-6 animate-fade-in">
                {students.length === 0 ? (
                  <div className="text-center p-10 bg-white rounded-2xl shadow-sm border border-slate-100">
                    <AlertCircle className="w-12 h-12 text-amber-400 mx-auto mb-3" />
                    <h3 className="text-lg font-bold text-slate-700">還沒有學生名單</h3>
                    <p className="text-slate-500 mt-1">請先到「系統設定」建立學生名單後再開始點餐。</p>
                    <button onClick={() => setActiveTab('setup')} className="mt-4 px-4 py-2 bg-indigo-100 text-indigo-700 rounded-lg hover:bg-indigo-200">去設定</button>
                  </div>
                ) : menuItems.length === 0 || menuItems.every(m => !m.name) ? (
                  <div className="text-center p-10 bg-white rounded-2xl shadow-sm border border-slate-100">
                    <Utensils className="w-12 h-12 text-amber-400 mx-auto mb-3" />
                    <h3 className="text-lg font-bold text-slate-700">菜單是空的</h3>
                    <p className="text-slate-500 mt-1">請先到「系統設定」建立菜單後再開始點餐。</p>
                    <button onClick={() => setActiveTab('setup')} className="mt-4 px-4 py-2 bg-indigo-100 text-indigo-700 rounded-lg hover:bg-indigo-200">去設定</button>
                  </div>
                ) : (
                  <>
                    {/* 步驟 1：選擇學生 */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                      <h2 className="text-lg font-bold mb-4">1. 選擇點餐班級/學生</h2>
                      <select
                        className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50 text-lg"
                        value={currentStudent}
                        onChange={(e) => handleSelectStudent(e.target.value)}
                      >
                        <option value="" disabled>-- 請選擇班級/名字 --</option>
                        {students.map(student => (
                          <option key={student} value={student}>
                            {student} {orders[student] ? ' (已點餐 ✅)' : ''}
                          </option>
                        ))}
                      </select>
                    </div>

                    {/* 步驟 2：選擇餐點 (依照分類群組顯示) */}
                    {currentStudent && (
                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 animate-fade-in">
                        <h2 className="text-lg font-bold mb-4 pb-3 border-b border-slate-100 flex justify-between items-center">
                          <span>2. 選擇餐點</span>
                          <span className="text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full text-sm">
                            目前身分：{currentStudent}
                          </span>
                        </h2>

                        <div className="space-y-6">
                          {Object.entries(groupedMenu).map(([category, items]) => (
                            <div key={category} className="mb-4">
                              <h3 className="text-md font-bold text-slate-700 flex items-center gap-2 mb-3">
                                <span className="w-2 h-2 rounded-full bg-indigo-500"></span>
                                {category}
                              </h3>
                              <div className="space-y-3">
                                {items.map(item => {
                                  const qty = currentCart[item.id] || 0;
                                  return (
                                    <div key={item.id} className={`flex items-center justify-between p-4 rounded-xl border transition-all ${qty > 0 ? 'border-indigo-400 bg-indigo-50/30' : 'border-slate-100 bg-slate-50'}`}>
                                      <div className="flex-1 flex items-center gap-3 min-w-0">
                                        <ItemImage src={item.image} className="w-16 h-16 rounded-lg shrink-0" />
                                        <div className="min-w-0">
                                          <div className="font-semibold text-slate-800 text-lg">{item.name}</div>
                                          <div className="text-slate-500">${item.price}</div>
                                        </div>
                                      </div>

                                      <div className="flex items-center gap-3 bg-white p-1 rounded-lg border border-slate-200 shadow-sm shrink-0">
                                        <button
                                          onClick={() => updateCart(item.id, -1)}
                                          className={`w-10 h-10 flex items-center justify-center rounded-md transition-colors ${qty > 0 ? 'text-slate-700 hover:bg-slate-100' : 'text-slate-300 cursor-not-allowed'}`}
                                          disabled={qty === 0}
                                        >
                                          -
                                        </button>
                                        <span className="w-8 text-center font-bold text-lg text-indigo-700">{qty}</span>
                                        <button
                                          onClick={() => updateCart(item.id, 1)}
                                          className="w-10 h-10 flex items-center justify-center rounded-md text-indigo-600 hover:bg-indigo-50 transition-colors font-bold text-xl"
                                        >
                                          +
                                        </button>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          ))}
                        </div>

                        {/* 購物車總計與送出 */}
                        <div className="mt-8 pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                          <div className="text-lg">
                            <span className="text-slate-500">當前總計：</span>
                            <span className="text-2xl font-bold text-rose-500">${calculateStudentTotal(currentCart)}</span>
                          </div>
                          <button
                            onClick={saveOrder}
                            disabled={Object.keys(currentCart).length === 0}
                            className={`w-full sm:w-auto px-8 py-3 rounded-xl font-bold text-lg transition-all shadow-sm ${Object.keys(currentCart).length > 0 ? 'bg-indigo-600 text-white hover:bg-indigo-700 hover:shadow-md hover:-translate-y-0.5' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                          >
                            確認並送出訂單
                          </button>
                        </div>
                      </div>
                    )}
                  </>
                )}
              </div>
            )}

            {/* =========================================
                Tab 3: 結帳統計
               ========================================= */}
            {activeTab === 'summary' && (
              <div className="space-y-6 animate-fade-in">

                {/* 區塊 1：店家總單 */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                  <div className="bg-amber-50 p-4 border-b border-amber-100 flex items-center gap-2">
                    <Utensils className="w-5 h-5 text-amber-600" />
                    <h2 className="text-lg font-bold text-amber-800">店家總單（跟店家點餐用）</h2>
                  </div>
                  <div className="p-0">
                    {Object.keys(itemTotals).length === 0 ? (
                      <p className="p-6 text-center text-slate-400">目前還沒有人點餐</p>
                    ) : (
                      <table className="w-full text-left">
                        <thead className="bg-slate-50 text-slate-500 text-sm">
                          <tr>
                            <th className="p-4 font-medium">品項名稱</th>
                            <th className="p-4 font-medium text-center">總數量</th>
                            <th className="p-4 font-medium text-right">小計</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {Object.entries(itemTotals).map(([itemId, qty]) => {
                            const item = menuItems.find(m => m.id === itemId);
                            if (!item) return null;
                            return (
                              <tr key={itemId} className="hover:bg-slate-50/50">
                                <td className="p-4 font-medium text-slate-800">{item.name}</td>
                                <td className="p-4 text-center font-bold text-indigo-600">{qty}</td>
                                <td className="p-4 text-right text-slate-600">${item.price * qty}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                        <tfoot className="bg-slate-50">
                          <tr>
                            <td colSpan="2" className="p-4 text-right font-bold text-slate-600">應付店家總計：</td>
                            <td className="p-4 text-right font-black text-rose-600 text-xl">${grandTotal}</td>
                          </tr>
                        </tfoot>
                      </table>
                    )}
                  </div>
                </div>

                {/* 區塊 2：學生個人帳單 */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                  <div className="bg-indigo-50 p-4 border-b border-indigo-100 flex items-center gap-2">
                    <PieChart className="w-5 h-5 text-indigo-600" />
                    <h2 className="text-lg font-bold text-indigo-800">各班/個人帳單（方便收錢）</h2>
                  </div>
                  <div className="p-0">
                     {Object.keys(orders).length === 0 ? (
                      <p className="p-6 text-center text-slate-400">目前還沒有人點餐</p>
                    ) : (
                      <table className="w-full text-left">
                        <thead className="bg-slate-50 text-slate-500 text-sm">
                          <tr>
                            <th className="p-4 font-medium">班級/姓名</th>
                            <th className="p-4 font-medium">點餐內容</th>
                            <th className="p-4 font-medium text-right">應收金額</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {students.map(student => {
                            const studentOrder = orders[student];
                            if (!studentOrder) return null;

                            const total = calculateStudentTotal(studentOrder);
                            const orderDetails = Object.entries(studentOrder)
                              .map(([itemId, qty]) => {
                                const item = menuItems.find(m => m.id === itemId);
                                return item ? `${item.name} x${qty}` : '';
                              })
                              .filter(Boolean)
                              .join('、');

                            return (
                              <tr key={student} className="hover:bg-slate-50/50">
                                <td className="p-4 font-bold text-slate-800">{student}</td>
                                <td className="p-4 text-slate-600 text-sm">{orderDetails}</td>
                                <td className="p-4 text-right font-bold text-rose-500">${total}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    )}
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* 拖曳中跟著手指/滑鼠移動的品項名稱 */}
          {dragState && (
            <div
              className="fixed z-50 pointer-events-none px-3 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg shadow-lg"
              style={{ left: dragState.x + 12, top: dragState.y + 12 }}
            >
              {dragState.name}
            </div>
          )}
        </div>
      );
    }

    // 將 React 元件掛載到 HTML 標籤上
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
