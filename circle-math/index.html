<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圓的周長與面積</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: notebook grid paper; question workspace on the left, π calculator docked on the right (stacks under on narrow screens). */
:root{
  --bg:#eef3f6; --grid:#dce6ec; --paper:#ffffff; --ink:#1b2830; --muted:#5a6b75; --line:#d3dde3;
  --accent:#1f6b87; --accent-ink:#ffffff; --accent-soft:#e1eff5;
  --r:#c96a17; --r-soft:#fcecdc;      /* 半徑 */
  --d:#1f6b87; --d-soft:#e1eff5;      /* 直徑 */
  --c:#7b4bb3; --c-soft:#efe6fa;      /* 周長 */
  --a:#2e8a63; --a-soft:#dff2e8;      /* 面積 */
  --ok:#2e8a4a; --ok-soft:#e2f3e7; --bad:#c03d36; --bad-soft:#fbe5e3;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --shadow:0 1px 2px rgba(20,40,55,.06),0 4px 14px rgba(20,40,55,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11181c; --grid:#18232a; --paper:#19232a; --ink:#e3ebef; --muted:#93a3ad; --line:#2b3a43;
  --accent:#5db1cf; --accent-ink:#0d1a20; --accent-soft:#183340;
  --r:#f0a35a; --r-soft:#3a2816; --d:#5db1cf; --d-soft:#183340; --c:#b991e6; --c-soft:#2c2140; --a:#6cc79d; --a-soft:#173327;
  --ok:#6cc98a; --ok-soft:#173322; --bad:#f08079; --bad-soft:#3a1d1b; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11181c; --grid:#18232a; --paper:#19232a; --ink:#e3ebef; --muted:#93a3ad; --line:#2b3a43;
  --accent:#5db1cf; --accent-ink:#0d1a20; --accent-soft:#183340;
  --r:#f0a35a; --r-soft:#3a2816; --d:#5db1cf; --d-soft:#183340; --c:#b991e6; --c-soft:#2c2140; --a:#6cc79d; --a-soft:#173327;
  --ok:#6cc98a; --ok-soft:#173322; --bad:#f08079; --bad-soft:#3a1d1b; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.6;color:var(--ink);background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.kr{color:var(--r);font-weight:700}.kd{color:var(--d);font-weight:700}.kc{color:var(--c);font-weight:700}.ka{color:var(--a);font-weight:700}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none}
.brand h1{margin:0;font-size:1.6rem;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;padding:8px 18px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:920px){.app{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* progress */
.progress{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-size:.8rem;font-weight:700;color:var(--muted);display:grid;place-items:center;padding:0}
.dot.cur{border-color:var(--accent);color:var(--accent)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.score{font-weight:700;color:var(--muted)}

/* question */
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.chip.path{background:var(--c-soft);color:var(--c)}
.qtext{font-size:1.45rem;font-weight:700;line-height:1.5;margin:4px 0 14px;text-wrap:pretty}
.qtext b{font-family:var(--num);font-weight:600;padding:0 2px}
.answer-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.answer-row label{font-weight:700}
.field{border:2px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 12px;min-width:0}
.field:focus{border-color:var(--accent);outline:none}
#ans{width:180px;font-family:var(--num);font-size:1.2rem}
.unit{color:var(--muted);font-weight:700}
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;padding:8px 16px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 10px;font-size:.85rem;border-width:1.5px}
.feedback{margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:700}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback small{display:block;font-weight:500;color:var(--ink);margin-top:2px}
.qnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.qnav .grp{display:flex;flex-wrap:wrap;gap:8px}

/* hint board */
.hint-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.hint-title h2{margin:0;font-size:1.1rem}
.callout{border-radius:10px;padding:10px 12px;background:var(--r-soft);font-weight:500}
.callout strong{color:var(--r)}
.callout.warn{background:var(--bad-soft)}
.callout.warn strong{color:var(--bad)}

/* visual path: fixed 2x2 map — 直徑 top-left, 周長 top-right, 半徑 bottom-left, 面積 bottom-right */
.map{display:grid;grid-template-columns:minmax(0,1fr) minmax(84px,160px) minmax(0,1fr);grid-template-rows:auto minmax(76px,auto) auto;
  grid-template-areas:"tl top tr" "left mid no" "bl bottom br";gap:8px;align-items:stretch;max-width:640px;margin:0 auto}
.map .tl{grid-area:tl}.map .tr{grid-area:tr}.map .bl{grid-area:bl}.map .br{grid-area:br}
.map .a-top{grid-area:top}.map .a-left{grid-area:left}.map .a-bottom{grid-area:bottom}.map .no{grid-area:no}
.node{min-width:0;border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;background:var(--paper)}
.node .nl{font-weight:900;font-size:1rem}
.node.k-r{border-color:var(--r)}.node.k-r .nl{color:var(--r)}
.node.k-d{border-color:var(--d)}.node.k-d .nl{color:var(--d)}
.node.k-c{border-color:var(--c)}.node.k-c .nl{color:var(--c)}
.node.k-a{border-color:var(--a)}.node.k-a .nl{color:var(--a)}
.node.given{background:var(--accent-soft)}
.node.off{border-style:dashed;border-color:var(--line);background:repeating-linear-gradient(135deg,var(--bg) 0 8px,var(--paper) 8px 16px);opacity:.75}
.node.off .nl{color:var(--muted)}
.node .nv{font-family:var(--num);font-size:1.15rem;font-weight:600}
.node input,.arw input{width:100%;min-width:0;text-align:center;font-family:var(--num);font-size:1.05rem;padding:6px}
.node input.ok,.arw input.ok{border-color:var(--ok);background:var(--ok-soft)}
.node input.bad,.arw input.bad{border-color:var(--bad);background:var(--bad-soft)}
.node .ask{font-size:.75rem;font-weight:700;color:var(--muted)}
.arw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;min-width:0}
.arw.v{flex-direction:row;gap:4px;justify-content:flex-start;justify-self:center}
.arw.v .ex{white-space:nowrap}
.map .node:not(.given){align-self:center}.map .node.given{align-self:center}
.arw .glyph{font-size:1.8rem;line-height:1;color:var(--accent);font-weight:700}
.arw .ot{max-width:100%;font-family:var(--num);font-weight:600;color:var(--ink);background:var(--bg);border:1.5px solid var(--accent);border-radius:8px;padding:2px 8px}
.arw .ex{font-family:var(--num);font-size:.8rem;color:var(--muted);min-height:1.2em;overflow-wrap:anywhere}
.arw .ex.known{color:var(--accent);font-weight:600}
.arw .v-txt{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.arw .sub{display:flex;flex-direction:column;gap:3px;align-items:center;border:1.5px dashed var(--muted);border-radius:10px;padding:6px;width:100%}
.arw .sub .nl{font-size:.8rem;font-weight:700;color:var(--muted)}
.map .no{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:.78rem;font-weight:700;text-align:center;border-left:2px dashed var(--line);margin-left:50%;padding-left:8px;justify-self:start}
@media (max-width:480px){.arw .ex{font-size:.72rem}.map{grid-template-columns:minmax(0,1fr) minmax(64px,auto) minmax(0,1fr);gap:6px}.arw .ot{padding:2px 4px;font-size:.85rem}.node{padding:8px 6px}}
.path-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.squares{margin-top:12px;overflow-x:auto}
.squares table{border-collapse:collapse;font-family:var(--num);font-size:.85rem}
.squares td,.squares th{border:1px solid var(--line);padding:3px 8px;text-align:center;white-space:nowrap}
.squares th{color:var(--muted);font-weight:600;font-family:var(--font)}
.squares td.hit{background:var(--r-soft);color:var(--r);font-weight:700}

.solution ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.solution li{font-family:var(--num);font-variant-numeric:tabular-nums}
.solution li span.t{font-family:var(--font)}

/* calculator */
aside.calc{position:sticky;top:max(16px,env(safe-area-inset-top,0px));}
@media (max-width:920px){aside.calc{position:static}}
.calc h2{margin:0 0 4px;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.calc .pi{font-family:var(--num);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 8px;font-size:.95rem}
.calc p.sub{margin:0 0 12px;color:var(--muted);font-size:.85rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.modes button{border:1.5px solid var(--line);background:transparent;border-radius:9px;padding:6px 4px;font-family:var(--num);font-weight:600;font-size:.95rem}
.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.calc-in{display:flex;align-items:center;gap:8px;font-family:var(--num);font-size:1.2rem;font-weight:600}
.calc-in input{flex:1;min-width:0;font-family:var(--num);font-size:1.4rem;padding:8px 10px}
.calc-in .opx{white-space:nowrap;color:var(--muted)}
.result{margin:12px 0 4px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.result .eq{color:var(--muted);font-size:.85rem;font-family:var(--num);overflow-wrap:anywhere}
.result .big{font-family:var(--num);font-size:2rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere;color:var(--accent)}
.steps{font-family:var(--num);font-size:.9rem;margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:2px 0}
.steps li.sum{border-bottom:0;font-weight:600;color:var(--ink)}
.steps .t{font-family:var(--font);color:var(--muted);font-size:.8rem}
.calc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.calc details{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.calc summary{font-weight:700;cursor:pointer}
.table314{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;margin-top:8px;font-family:var(--num);font-size:.88rem}
.table314 div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line)}
.history{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.history button{width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 8px;font-family:var(--num);font-size:.85rem;overflow-wrap:anywhere}

/* setup tab */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.setup{grid-template-columns:minmax(0,1fr)}}
.setup h2{margin:0 0 4px;font-size:1.2rem}
.setup p.sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
fieldset{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;padding:10px 14px}
legend{font-weight:700;padding:0 6px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px}
.checks label,.radios label{display:flex;gap:6px;align-items:center}
.radios{display:flex;flex-wrap:wrap;gap:6px 16px}
.form-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:center}
.form-grid label{font-weight:700}
.form-grid .field{width:100%}
.preview{margin:12px 0;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:.95rem}
.preview .warn{color:var(--bad);font-weight:700}
.qlist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:q}
.qlist li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;counter-increment:q}
.qlist li::before{content:counter(q);font-weight:700;color:var(--muted);font-family:var(--num);min-width:1.4em}
.qlist .qt{flex:1;min-width:0}
.qlist .qa{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
textarea.field{width:100%;min-height:70px;font-family:var(--num);font-size:.8rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-weight:700;z-index:20}
@media (prefers-reduced-motion:no-preference){.feedback,.toast{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}}.toast{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
        <circle cx="23" cy="23" r="19" fill="none" stroke="var(--c)" stroke-width="3"/>
        <line x1="4" y1="23" x2="42" y2="23" stroke="var(--d)" stroke-width="3"/>
        <line x1="23" y1="23" x2="35" y2="8.5" stroke="var(--r)" stroke-width="3"/>
        <circle cx="23" cy="23" r="2.6" fill="var(--ink)"/>
      </svg>
      <div>
        <h1>圓的周長與面積</h1>
        <p>國小高年級　圓周率用 3.14</p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-practice" aria-selected="true" data-tab="practice">練習</button>
      <button role="tab" id="tab-setup" aria-selected="false" data-tab="setup">出題</button>
    </nav>
  </header>

  <div class="app">
    <main class="stack">
      <!-- 練習 -->
      <section id="view-practice" class="stack">
        <div class="panel progress">
          <div class="dots" id="dots"></div>
          <div class="score" id="score"></div>
        </div>
        <div class="panel" id="qcard"></div>
        <div class="panel" id="hint"></div>
        <div class="panel solution" id="solution" hidden></div>
      </section>

      <!-- 出題 -->
      <section id="view-setup" hidden>
        <div class="setup">
          <div class="panel">
            <h2>自動出題</h2>
            <p class="sub">勾選題型，系統會用整數半徑出題，答案都算得剛好。</p>
            <fieldset>
              <legend>基本題（出現提示板）</legend>
              <div class="checks" id="types-basic"></div>
            </fieldset>
            <fieldset>
              <legend>綜合題（出現視覺路徑）</legend>
              <div class="checks" id="types-path"></div>
            </fieldset>
            <fieldset>
              <legend>半徑範圍</legend>
              <div class="radios">
                <label><input type="radio" name="range" id="range10" value="10" checked> 1～10</label>
                <label><input type="radio" name="range" id="range20" value="20"> 1～20</label>
                <label><input type="radio" name="range" id="range30" value="30"> 1～30</label>
              </div>
            </fieldset>
            <fieldset>
              <legend>其他</legend>
              <div class="form-grid">
                <label for="count">題數</label>
                <select id="count" class="field"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>
                <label for="ctx">題目</label>
                <select id="ctx" class="field"><option value="1" selected>生活情境（花圃、披薩…）</option><option value="0">一個圓</option></select>
                <label for="hintmode">提示</label>
                <select id="hintmode" class="field"><option value="auto" selected>自動顯示</option><option value="click">學生按了才顯示</option></select>
              </div>
            </fieldset>
            <button class="btn" id="gen">產生題目並開始練習</button>
          </div>

          <div class="panel">
            <h2>自行出題</h2>
            <p class="sub">選題型、填數字，系統會算出答案並檢查數字好不好算。</p>
            <div class="form-grid">
              <label for="c-type">題型</label>
              <select id="c-type" class="field"></select>
              <label for="c-val" id="c-val-label">已知</label>
              <div class="row"><input id="c-val" class="field num" inputmode="decimal" style="width:140px" value="6"><select id="c-unit" class="field"><option>公分</option><option>公尺</option><option>公里</option></select></div>
              <label for="c-text">題目文字</label>
              <input id="c-text" class="field" placeholder="可留白，系統自動產生">
            </div>
            <div class="preview" id="c-preview"></div>
            <div class="row">
              <button class="btn" id="c-add">加入題目</button>
              <button class="btn ghost" id="c-play">用這份題目練習</button>
              <button class="btn quiet" id="c-clear">清空</button>
            </div>
            <ol class="qlist" id="c-list"></ol>
            <fieldset style="margin-top:16px">
              <legend>分享題目給學生</legend>
              <p class="sub" style="margin:0 0 8px">複製題目代碼貼給學生，學生貼上後按「匯入」就能練習同一份題目。</p>
              <textarea id="c-code" class="field" placeholder="在這裡貼上題目代碼"></textarea>
              <div class="row" style="margin-top:8px">
                <button class="btn sm ghost" id="c-copy">複製題目代碼</button>
                <button class="btn sm" id="c-import">匯入並練習</button>
              </div>
            </fieldset>
          </div>
        </div>
      </section>
    </main>

    <!-- 圓周率計算器 -->
    <aside class="panel calc" aria-label="圓周率計算器">
      <h2>圓周率計算器 <span class="pi">π≈3.14</span></h2>
      <p class="sub">輸入數字，馬上幫你算，也會拆開讓你看怎麼算。</p>
      <div class="modes" id="modes">
        <button data-mode="mul" aria-pressed="true">□ × 3.14</button>
        <button data-mode="div" aria-pressed="false">□ ÷ 3.14</button>
        <button data-mode="sq" aria-pressed="false">□ × □</button>
        <button data-mode="sqpi" aria-pressed="false">□×□×3.14</button>
      </div>
      <div class="calc-in"><input id="calc-in" class="field" inputmode="decimal" value="12" aria-label="輸入數字"><span class="opx" id="calc-op">× 3.14</span></div>
      <div class="result">
        <div class="eq" id="calc-eq"></div>
        <div class="big" id="calc-out"></div>
        <ul class="steps" id="calc-steps"></ul>
      </div>
      <div class="calc-actions">
        <button class="btn sm" id="calc-fill">填入答案格</button>
        <button class="btn sm quiet" id="calc-save">記下來</button>
      </div>
      <ul class="history" id="calc-hist"></ul>
      <details>
        <summary>3.14 乘法表</summary>
        <div class="table314" id="t314"></div>
      </details>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const PI = 3.14;
const NAME = {r:'半徑', d:'直徑', C:'周長', A:'面積'};
const KCLS = {r:'kr', d:'kd', C:'kc', A:'ka'};
const TYPES = {
  r2C:{give:'r', ask:'C', label:'已知半徑求周長'},
  d2C:{give:'d', ask:'C', label:'已知直徑求周長'},
  r2A:{give:'r', ask:'A', label:'已知半徑求面積'},
  d2A:{give:'d', ask:'A', label:'已知直徑求面積'},
  C2d:{give:'C', ask:'d', label:'已知周長求直徑'},
  C2r:{give:'C', ask:'r', label:'已知周長求半徑'},
  C2A:{give:'C', ask:'A', label:'已知周長求面積', path:true},
  A2C:{give:'A', ask:'C', label:'已知面積求周長', path:true},
};
const CONTEXTS = [
  ['一個圓形花圃','公尺'],['一張圓形桌面','公分'],['一個圓形水池','公尺'],['一片圓形披薩','公分'],
  ['一個圓形鐘面','公分'],['一塊圓形草地','公尺'],['一個圓形杯墊','公分'],['一個圓形廣場','公尺']
];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R4 = x => +(+x).toFixed(4);
const R2 = x => +(+x).toFixed(2);
const f = x => (x === null || x === undefined || !isFinite(x)) ? '—' : String(R4(x));
const near = (a, b) => Math.abs(a - b) <= 0.011;
const parseNum = s => { const v = parseFloat(String(s).replace(/[，,\s]/g,'').replace('．','.')); return isFinite(v) ? v : NaN; };
const unitOf = (k, u) => k === 'A' ? '平方' + u : u;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- math ---------- */
function solve(type, g){
  const t = TYPES[type];
  let r, d, C, A, s, exact = true;
  if (t.give === 'r'){ r = g; d = g * 2; C = d * PI; A = r * r * PI; }
  else if (t.give === 'd'){ d = g; r = g / 2; C = d * PI; A = r * r * PI; }
  else if (t.give === 'C'){
    C = g; d = R4(g / PI);
    if (Math.abs(d * PI - g) > 1e-6){ exact = false; d = R2(g / PI); }
    r = exact ? d / 2 : R2(d / 2);
    A = exact ? r * r * PI : R2(r * r * PI);
  } else {
    A = g; s = R4(g / PI);
    const rr = Math.sqrt(s);
    if (Math.abs(rr - Math.round(rr)) > 1e-6 || Math.abs(s * PI - g) > 1e-6){ exact = false; s = R2(g / PI); r = R2(Math.sqrt(s)); }
    else r = Math.round(rr);
    d = r * 2; C = exact ? d * PI : R2(d * PI);
  }
  const v = {r:R4(r), d:R4(d), C:R4(C), A:R4(A), s:R4(s !== undefined ? s : r * r), exact};
  v.answer = v[t.ask];
  return v;
}

function makeProblem(type, given, unit, ctx, text){
  const p = {type, given:R4(given), unit:unit || '公分', ctx:ctx || '', text:text || ''};
  p.v = solve(type, p.given);
  return p;
}
function questionText(p){
  if (p.text) return esc(p.text);
  const t = TYPES[p.type];
  const who = p.ctx || '一個圓';
  return `${esc(who)}的<span class="${KCLS[t.give]}">${NAME[t.give]}</span>是 <b>${f(p.given)}</b> ${unitOf(t.give, p.unit)}，它的<span class="${KCLS[t.ask]}">${NAME[t.ask]}</span>是多少${unitOf(t.ask, p.unit)}？`;
}

function randInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function genProblem(type, max, useCtx){
  const r = randInt(1, max);
  const [ctx, unit] = useCtx ? CONTEXTS[randInt(0, CONTEXTS.length - 1)] : ['', '公分'];
  const t = TYPES[type];
  let given;
  if (t.give === 'r') given = r;
  else if (t.give === 'd') given = (type === 'd2C' && Math.random() < .5) ? randInt(1, max * 2) : r * 2;
  else if (t.give === 'C') given = R4(r * 2 * PI);
  else given = R4(r * r * PI);
  return makeProblem(type, given, unit, ctx);
}

/* ---------- solution steps ---------- */
function steps(p){
  const v = p.v, t = TYPES[p.type], L = [];
  const u = p.unit, ua = '平方' + u;
  const lineD = () => L.push(['直徑 = 半徑 × 2', `${f(v.r)} × 2 = ${f(v.d)}（${u}）`]);
  const lineR = () => L.push(['半徑 = 直徑 ÷ 2', `${f(v.d)} ÷ 2 = ${f(v.r)}（${u}）`]);
  const lineC = () => L.push(['周長 = 直徑 × 3.14', `${f(v.d)} × 3.14 = ${f(v.C)}（${u}）`]);
  const lineA = () => L.push(['面積 = 半徑 × 半徑 × 3.14', `${f(v.r)} × ${f(v.r)} × 3.14 = ${f(R4(v.r*v.r))} × 3.14 = ${f(v.A)}（${ua}）`]);
  const lineCd = () => L.push(['直徑 = 周長 ÷ 3.14', `${f(v.C)} ÷ 3.14 = ${f(v.d)}（${u}）${v.exact ? '' : '（四捨五入到小數第二位）'}`]);
  switch (p.type){
    case 'r2C': lineD(); lineC(); break;
    case 'd2C': lineC(); break;
    case 'r2A': lineA(); break;
    case 'd2A': lineR(); lineA(); break;
    case 'C2d': lineCd(); break;
    case 'C2r': lineCd(); lineR(); break;
    case 'C2A': lineCd(); lineR(); lineA(); break;
    case 'A2C':
      L.push(['半徑 × 半徑 = 面積 ÷ 3.14', `${f(v.A)} ÷ 3.14 = ${f(v.s)}`]);
      L.push(['哪個數 × 自己 = ' + f(v.s) + '？', `${f(v.r)} × ${f(v.r)} = ${f(R4(v.r*v.r))}，所以半徑 = ${f(v.r)}（${u}）`]);
      lineD(); lineC(); break;
  }
  return L;
}

/* common mistakes */
function diagnose(p, x){
  const v = p.v, t = TYPES[p.type];
  if (t.ask === 'A'){
    if (near(x, v.d * v.d * PI)) return '你好像用「直徑 × 直徑 × 3.14」。面積要用半徑，先把直徑 ÷ 2。';
    if (near(x, v.d * PI)) return '這是周長的算法。面積 = 半徑 × 半徑 × 3.14。';
    if (near(x, v.r * v.r)) return '半徑 × 半徑之後，還要再 × 3.14 喔。';
  }
  if (t.ask === 'C'){
    if (near(x, v.r * PI)) return '你用了半徑 × 3.14。周長要用直徑：半徑 × 2 再 × 3.14。';
    if (near(x, v.r * v.r * PI)) return '這是面積的算法。周長 = 直徑 × 3.14。';
    if (near(x, v.d)) return '這是直徑，還要再 × 3.14 才是周長。';
  }
  if (t.ask === 'd' && near(x, v.r)) return '這是半徑。直徑 = 周長 ÷ 3.14，不用再 ÷ 2。';
  if (t.ask === 'r' && near(x, v.d)) return '這是直徑，半徑還要再 ÷ 2。';
  return '再算一次看看，可以打開提示，或用右邊的計算器。';
}

/* ---------- state ---------- */
const settings = Object.assign({types:['r2C','d2C','r2A','d2A','C2A','A2C'], range:10, count:10, ctx:1, hint:'auto'}, store.get('circle.settings', {}));
let custom = store.get('circle.custom', []).filter(q => TYPES[q.type]).map(q => makeProblem(q.type, q.given, q.unit, q.ctx, q.text));
let questions = [], results = [], idx = 0, hintOpen = settings.hint === 'auto', revealed = 0, solShown = false;
let lastInput = null;

function generate(){
  const types = settings.types.length ? settings.types : Object.keys(TYPES);
  questions = [];
  for (let i = 0; i < settings.count; i++){
    let p, tries = 0;
    do { p = genProblem(types[i % types.length], settings.range, !!settings.ctx); tries++; }
    while (tries < 20 && questions.some(q => q.type === p.type && q.given === p.given));
    questions.push(p);
  }
  // shuffle lightly so types are mixed
  for (let i = questions.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [questions[i], questions[j]] = [questions[j], questions[i]]; }
  startSet();
}
function startSet(){ results = questions.map(() => null); idx = 0; resetQ(); renderPractice(); }
function resetQ(){ hintOpen = settings.hint === 'auto'; revealed = 0; solShown = false; }

/* ---------- render practice ---------- */
function renderDots(){
  const dots = $('#dots');
  dots.innerHTML = questions.map((q, i) => `<button class="dot ${i === idx ? 'cur' : ''} ${results[i] === true ? 'ok' : results[i] === false ? 'bad' : ''}" data-i="${i}" aria-label="第 ${i+1} 題">${i+1}</button>`).join('');
  const done = results.filter(r => r !== null).length, ok = results.filter(r => r === true).length;
  $('#score').textContent = `答對 ${ok} 題／已作答 ${done} 題／共 ${questions.length} 題`;
}
function renderPractice(){
  renderDots();
  const p = questions[idx];
  if (!p){ $('#qcard').innerHTML = '<p class="empty">還沒有題目，到「出題」產生題目。</p>'; $('#hint').hidden = true; return; }
  const t = TYPES[p.type];
  $('#qcard').innerHTML = `
    <div class="qhead"><span class="chip">第 ${idx+1} 題</span><span class="chip ${t.path ? 'path' : ''}">${t.label}</span></div>
    <p class="qtext">${questionText(p)}</p>
    <div class="answer-row">
      <label for="ans">答案</label>
      <input id="ans" class="field" inputmode="decimal" autocomplete="off" placeholder="輸入答案">
      <span class="unit">${unitOf(t.ask, p.unit)}</span>
      <button class="btn" id="check">檢查</button>
    </div>
    <div id="fb"></div>
    <div class="qnav">
      <div class="grp">
        <button class="btn quiet" id="toggle-hint">${hintOpen ? '收起' : '打開'}${t.path ? '視覺路徑' : '提示板'}</button>
        <button class="btn quiet" id="show-sol">${solShown ? '收起解答' : '看解答'}</button>
      </div>
      <div class="grp">
        <button class="btn ghost" id="prev" ${idx === 0 ? 'disabled' : ''}>上一題</button>
        <button class="btn ghost" id="next" ${idx === questions.length - 1 ? 'disabled' : ''}>下一題</button>
      </div>
    </div>`;
  lastInput = $('#ans');
  $('#ans').addEventListener('focus', e => lastInput = e.target);
  $('#ans').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  $('#check').onclick = check;
  $('#prev').onclick = () => go(idx - 1);
  $('#next').onclick = () => go(idx + 1);
  $('#toggle-hint').onclick = e => { hintOpen = !hintOpen; e.target.textContent = (hintOpen ? '收起' : '打開') + (t.path ? '視覺路徑' : '提示板'); renderHint(p); };
  $('#show-sol').onclick = e => { solShown = !solShown; e.target.textContent = solShown ? '收起解答' : '看解答'; renderSolution(p); };
  renderHint(p);
  renderSolution(p);
}
function go(i){ if (i < 0 || i >= questions.length) return; idx = i; resetQ(); renderPractice(); }

function check(){
  const p = questions[idx], x = parseNum($('#ans').value), fb = $('#fb');
  if (isNaN(x)){ fb.innerHTML = '<div class="feedback bad">請先輸入數字。</div>'; return; }
  const ok = near(x, p.v.answer);
  if (results[idx] !== true) results[idx] = ok;
  const t = TYPES[p.type];
  fb.innerHTML = ok
    ? `<div class="feedback ok">答對了！${NAME[t.ask]}是 ${f(p.v.answer)} ${unitOf(t.ask, p.unit)}。</div>`
    : `<div class="feedback bad">還不對喔。<small>${diagnose(p, x)}</small></div>`;
  renderDots();
}

/* ---------- hint board / visual path ---------- */
const TIPS = {
  r2C:['', '題目給「<strong>半徑</strong>」，周長公式要用「直徑」：先把半徑 × 2 變成直徑，再 × 3.14。'],
  d2C:['', '題目直接給「<strong>直徑</strong>」，直接 × 3.14 就是周長。'],
  r2A:['', '題目給「<strong>半徑</strong>」，正好放進面積公式：半徑 × 半徑 × 3.14。小心，不是半徑 × 2！'],
  d2A:['warn', '<strong>注意！</strong>題目給的是「直徑」，面積公式要用「半徑」：先把直徑 ÷ 2 找到半徑。'],
  C2d:['', '周長 = 直徑 × 3.14，倒過來想：<strong>直徑 = 周長 ÷ 3.14</strong>。'],
  C2r:['warn', '<strong>兩步驟：</strong>周長 ÷ 3.14 先得到「直徑」，再 ÷ 2 才是半徑。'],
};
function renderHint(p){
  const box = $('#hint');
  box.hidden = !hintOpen;
  if (hintOpen) renderPath(p);
}

/* Fixed 2x2 map. Each type walks a route through it; corners off the route are covered. */
const ROUTES = {
  r2C:['r','d','c'], d2C:['d','c'], r2A:['r','a'], d2A:['d','r','a'],
  C2d:['c','d'], C2r:['c','d','r'], C2A:['c','d','r','a'], A2C:['a','r','d','c']
};
const POS = {d:'tl', c:'tr', r:'bl', a:'br'};
function pathModel(p){
  const v = p.v, route = ROUTES[p.type];
  const B = {
    d:{k:'d', label:'直徑', val:v.d, pos:'tl'}, c:{k:'c', label:'周長', val:v.C, pos:'tr'},
    r:{k:'r', label:'半徑', val:v.r, pos:'bl'}, a:{k:'a', label:'面積', val:v.A, pos:'br'}
  };
  Object.keys(B).forEach(k => { if (!route.includes(k)) B[k].off = true; });
  B[route[0]].given = true;
  const EDGE = {
    'c>d':['top', {glyph:'←', op:'÷ 3.14', ex:x => `${x} ÷ 3.14`}],
    'd>c':['top', {glyph:'→', op:'× 3.14', ex:x => `${x} × 3.14`}],
    'd>r':['left', {glyph:'↓', op:'÷ 2', ex:x => `${x} ÷ 2`}],
    'r>d':['left', {glyph:'↑', op:'× 2', ex:x => `${x} × 2`}],
    'r>a':['bottom', {glyph:'→', op:'× 半徑 × 3.14', ex:x => `${x} × ${x} × 3.14`}],
    'a>r':['bottom', {glyph:'←', op:'÷ 3.14', ex:x => `${x} ÷ 3.14`, op2:'哪個數 × 自己？'}],
  };
  const arrows = {};
  let step = 0;
  for (let i = 1; i < route.length; i++){
    const [name, a] = EDGE[route[i-1] + '>' + route[i]];
    arrows[name] = Object.assign({from:route[i-1]}, a);
    if (a.op2) arrows[name].sub = {label:'半徑×半徑', val:v.s, step:++step};
    B[route[i]].step = ++step;
  }
  B[route[route.length - 1]].final = true;
  return {B, arrows, total:step, route};
}
function renderPath(p){
  const box = $('#hint'), M = pathModel(p), t = TYPES[p.type];
  const typed = {};
  box.querySelectorAll('input[data-step]').forEach(i => typed[i.dataset.step] = i.value);
  const inp = (val, step, label) => `<input class="field" size="4" data-exp="${val}" data-step="${step}" inputmode="decimal" aria-label="${label}" placeholder="?" value="${step <= revealed ? f(val) : esc(typed[step] || '')}">`;
  const node = nd => nd.off
    ? `<div class="node off ${nd.pos}" aria-hidden="true"><span class="nl">${nd.label}</span><span class="ask">這題用不到</span></div>`
    : nd.given
    ? `<div class="node k-${nd.k} given ${nd.pos}" data-key="${nd.k}"><span class="nl">${nd.label}</span><span class="nv">${f(nd.val)}</span><span class="ask">題目給的</span></div>`
    : `<div class="node k-${nd.k} ${nd.pos}" data-key="${nd.k}"><span class="nl">${nd.label}</span>${inp(nd.val, nd.step, nd.label)}<span class="ask">${nd.final ? '答案' : '第 ' + nd.step + ' 步'}</span></div>`;
  const arrow = (name, a) => {
    const vert = name === 'left';
    const txt = `<span class="ot">${esc(a.op)}</span><span class="ex" data-ex="${name}"></span>`;
    if (vert) return `<div class="arw v a-${name}"><span class="glyph">${a.glyph}</span><span class="v-txt">${txt}</span></div>`;
    const sub = a.sub ? `<div class="sub"><span class="nl">${a.sub.label}</span>${inp(a.sub.val, a.sub.step, a.sub.label)}<span class="nl">第 ${a.sub.step} 步</span></div><span class="ot">${esc(a.op2)}</span>` : '';
    return `<div class="arw a-${name}"><span class="glyph">${a.glyph}</span>${txt}${sub}</div>`;
  };
  const sq = p.type === 'A2C' ? (() => {
    const max = Math.max(20, Math.ceil(p.v.r));
    let h = '<tr><th>半徑</th>', b = '<tr><th>半徑×半徑</th>';
    for (let i = 1; i <= max; i++){ const hit = (i === p.v.r && revealed >= 2) ? ' class="hit"' : ''; h += `<td${hit}>${i}</td>`; b += `<td${hit}>${i*i}</td>`; }
    return `<div class="squares"><table><tbody>${h}</tr>${b}</tr></tbody></table></div>`;
  })() : '';
  box.innerHTML = `
    <div class="hint-title"><h2>${t.path ? '視覺路徑' : '提示板'}</h2><span class="chip ${t.path ? 'path' : ''}">${t.label}</span></div>
    <p style="margin:0 0 12px;color:var(--muted)">從「${NAME[t.give]}」出發，沿著箭頭走到「${NAME[t.ask]}」。每一格填對會變綠色。</p>
    <div class="map">
      ${Object.values(M.B).map(node).join('')}
      ${Object.entries(M.arrows).map(([k, a]) => arrow(k, a)).join('')}
      ${M.route.includes('c') && M.route.includes('a') ? '<div class="no">周長和面積<br>不能直接換</div>' : ''}
    </div>
    ${sq}
    ${TIPS[p.type] ? `<div class="callout ${TIPS[p.type][0]}" style="margin-top:12px">${TIPS[p.type][1]}</div>` : ''}
    <div class="path-tools">
      <button class="btn sm ghost" id="reveal" ${revealed >= M.total ? 'disabled' : ''}>給我下一步</button>
      <span style="color:var(--muted);font-size:.85rem">右邊的計算器可以幫你算 ÷ 3.14 和 × 3.14</span>
    </div>`;
  // which values are known: given, or the student's box is correct
  const known = key => {
    const nd = M.B[key];
    if (nd.given) return nd.val;
    if (nd.off) return null;
    const i = box.querySelector(`.node[data-key="${key}"] input`);
    return i && i.classList.contains('ok') ? nd.val : null;
  };
  const updateEx = () => {
    Object.entries(M.arrows).forEach(([name, a]) => {
      const el = box.querySelector(`[data-ex="${name}"]`), x = known(a.from);
      el.textContent = x === null ? '' : a.ex(f(x)) + ' = ?';
      el.classList.toggle('known', x !== null);
    });
  };
  box.querySelectorAll('input[data-step]').forEach(i => {
    const mark = () => {
      const x = parseNum(i.value);
      i.classList.remove('ok', 'bad');
      if (i.value.trim() !== '') i.classList.add(near(x, +i.dataset.exp) ? 'ok' : 'bad');
    };
    mark();
    i.addEventListener('input', () => { mark(); updateEx(); });
    i.addEventListener('focus', () => lastInput = i);
  });
  updateEx();
  $('#reveal').onclick = () => { revealed++; renderPath(p); };
}

function renderSolution(p){
  const box = $('#solution');
  box.hidden = !solShown;
  if (!solShown) return;
  const t = TYPES[p.type];
  box.innerHTML = `<div class="hint-title"><h2>解答</h2></div>
    <ol>${steps(p).map(([a, b]) => `<li><span class="t">${a}</span><br>${b}</li>`).join('')}</ol>
    <p style="margin:12px 0 0;font-weight:700">答：${NAME[t.ask]}是 ${f(p.v.answer)} ${unitOf(t.ask, p.unit)}</p>`;
}

/* ---------- calculator ---------- */
let mode = 'mul', hist = store.get('circle.hist', []);
const OPS = {mul:'× 3.14', div:'÷ 3.14', sq:'× 自己', sqpi:'× 自己 × 3.14'};
function decomp(n){
  const a = R4(n * 3), b = R4(n * 0.1), c = R4(n * 0.04);
  return [[`${f(n)} × 3`, a], [`${f(n)} × 0.1`, b], [`${f(n)} × 0.04`, c]];
}
function calc(){
  const n = parseNum($('#calc-in').value);
  $('#calc-op').textContent = OPS[mode];
  const out = $('#calc-out'), eq = $('#calc-eq'), st = $('#calc-steps');
  if (isNaN(n)){ out.textContent = '—'; eq.textContent = '請輸入數字'; st.innerHTML = ''; return null; }
  let res, rows = [];
  if (mode === 'mul'){
    res = R4(n * PI); eq.textContent = `${f(n)} × 3.14 =`;
    rows = decomp(n).map(([l, v]) => `<li><span>${l}</span><span>${f(v)}</span></li>`);
    rows.push(`<li class="sum"><span>加起來</span><span>${f(res)}</span></li>`);
    rows.unshift('<li><span class="t">3.14 = 3 + 0.1 + 0.04，分開算再加起來</span></li>');
  } else if (mode === 'div'){
    const q = R4(n / PI), exact = Math.abs(q * PI - n) < 1e-9;
    res = exact ? q : R2(n / PI);
    eq.textContent = `${f(n)} ÷ 3.14 ${exact ? '=' : '≈'}`;
    rows.push(exact ? '<li><span class="t">剛好除盡</span></li>' : '<li><span class="t">除不盡，四捨五入到小數第二位</span></li>');
    rows.push(`<li><span>驗算 ${f(res)} × 3.14</span><span>${f(R4(res * PI))}</span></li>`);
  } else if (mode === 'sq'){
    res = R4(n * n); eq.textContent = `${f(n)} × ${f(n)} =`;
    rows.push('<li><span class="t">找面積前，先算半徑 × 半徑</span></li>');
  } else {
    const s = R4(n * n); res = R4(s * PI); eq.textContent = `${f(n)} × ${f(n)} × 3.14 =`;
    rows.push(`<li><span>${f(n)} × ${f(n)}</span><span>${f(s)}</span></li>`);
    decomp(s).forEach(([l, v]) => rows.push(`<li><span>${l}</span><span>${f(v)}</span></li>`));
    rows.push(`<li class="sum"><span>加起來</span><span>${f(res)}</span></li>`);
  }
  out.textContent = f(res);
  st.innerHTML = rows.join('');
  return {n, res};
}
function renderHist(){
  $('#calc-hist').innerHTML = hist.map((h, i) => `<li><button data-h="${i}">${f(h.n)} ${OPS[h.mode]} → ${f(h.res)}</button></li>`).join('');
}
function saveHist(){
  const r = calc(); if (!r) return;
  if (hist[0] && hist[0].n === r.n && hist[0].mode === mode) return;
  hist.unshift({n:r.n, mode, res:r.res}); hist = hist.slice(0, 6);
  store.set('circle.hist', hist); renderHist();
}
$('#calc-in').addEventListener('input', calc);
$('#calc-in').addEventListener('keydown', e => { if (e.key === 'Enter') saveHist(); });
$('#calc-save').onclick = saveHist;
$('#modes').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]'); if (!b) return;
  mode = b.dataset.mode;
  document.querySelectorAll('#modes button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  calc();
});
$('#calc-hist').addEventListener('click', e => {
  const b = e.target.closest('button[data-h]'); if (!b) return;
  const h = hist[+b.dataset.h]; mode = h.mode; $('#calc-in').value = f(h.n);
  document.querySelectorAll('#modes button').forEach(x => x.setAttribute('aria-pressed', x.dataset.mode === mode ? 'true' : 'false'));
  calc();
});
$('#calc-fill').onclick = () => {
  const r = calc(); if (!r) return;
  const target = (lastInput && document.body.contains(lastInput)) ? lastInput : $('#ans');
  if (!target){ toast('先到「練習」打開一題'); return; }
  target.value = f(r.res); target.dispatchEvent(new Event('input')); target.focus();
  saveHist();
};
$('#t314').innerHTML = Array.from({length:20}, (_, i) => `<div><span>${i+1} × 3.14</span><span>${f(R4((i+1) * PI))}</span></div>`).join('');

/* ---------- setup: auto ---------- */
function renderTypeChecks(){
  const mk = path => Object.entries(TYPES).filter(([, t]) => !!t.path === path)
    .map(([k, t]) => `<label><input type="checkbox" id="ty-${k}" value="${k}" ${settings.types.includes(k) ? 'checked' : ''}> ${t.label}</label>`).join('');
  $('#types-basic').innerHTML = mk(false);
  $('#types-path').innerHTML = mk(true);
  const rr = document.querySelector(`input[name=range][value="${settings.range}"]`); if (rr) rr.checked = true;
  $('#count').value = String(settings.count); $('#ctx').value = String(settings.ctx); $('#hintmode').value = settings.hint;
}
$('#gen').onclick = () => {
  settings.types = [...document.querySelectorAll('#types-basic input:checked, #types-path input:checked')].map(i => i.value);
  if (!settings.types.length){ toast('請至少勾選一種題型'); return; }
  settings.range = +document.querySelector('input[name=range]:checked').value;
  settings.count = +$('#count').value; settings.ctx = +$('#ctx').value; settings.hint = $('#hintmode').value;
  store.set('circle.settings', settings);
  generate(); showTab('practice');
};

/* ---------- setup: custom ---------- */
$('#c-type').innerHTML = Object.entries(TYPES).map(([k, t]) => `<option value="${k}">${t.label}</option>`).join('');
function customPreview(){
  const type = $('#c-type').value, t = TYPES[type], g = parseNum($('#c-val').value), u = $('#c-unit').value;
  $('#c-val-label').textContent = '已知' + NAME[t.give];
  const pv = $('#c-preview');
  if (isNaN(g) || g <= 0){ pv.innerHTML = '<span class="warn">請輸入大於 0 的數字。</span>'; return null; }
  const p = makeProblem(type, g, u, '', $('#c-text').value.trim());
  let warn = '';
  if (!p.v.exact){
    warn = t.give === 'A'
      ? `面積 ÷ 3.14 = ${f(R4(g / PI))}，找不到整數半徑（約 ${f(p.v.r)}），學生不容易算。建議用「半徑×半徑×3.14」的結果當面積，例如 ${f(R4(Math.max(1, Math.round(p.v.r)) ** 2 * PI))}。`
      : `周長 ÷ 3.14 除不盡，答案會四捨五入到小數第二位。建議用「直徑×3.14」的結果，例如 ${f(R4(Math.max(1, Math.round(p.v.d)) * PI))}。`;
  }
  pv.innerHTML = `<div>${questionText(p)}</div><div style="margin-top:4px">答案：<b class="num">${f(p.v.answer)}</b> ${unitOf(t.ask, u)}　<span style="color:var(--muted)">（半徑 ${f(p.v.r)}、直徑 ${f(p.v.d)}）</span></div>${warn ? `<div class="warn" style="margin-top:4px">${warn}</div>` : ''}`;
  return p;
}
['#c-type', '#c-val', '#c-unit', '#c-text'].forEach(s => $(s).addEventListener('input', customPreview));
function saveCustom(){ store.set('circle.custom', custom.map(({type, given, unit, ctx, text}) => ({type, given, unit, ctx, text}))); }
function renderCustom(){
  const ul = $('#c-list');
  if (!custom.length){ ul.innerHTML = '<li style="border:0;padding:0" class="empty">還沒有自訂題目。</li>'; ul.style.counterReset = 'none'; return; }
  ul.style.counterReset = '';
  ul.innerHTML = custom.map((p, i) => `<li><div class="qt">${questionText(p)}<div class="qa">${TYPES[p.type].label}　答案 ${f(p.v.answer)} ${unitOf(TYPES[p.type].ask, p.unit)}</div></div><button class="btn sm quiet" data-del="${i}" aria-label="刪除第 ${i+1} 題">刪除</button></li>`).join('');
}
$('#c-list').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  custom.splice(+b.dataset.del, 1); saveCustom(); renderCustom();
});
$('#c-add').onclick = () => { const p = customPreview(); if (!p) return; custom.push(p); saveCustom(); renderCustom(); $('#c-text').value = ''; toast('已加入第 ' + custom.length + ' 題'); };
$('#c-clear').onclick = () => {
  const b = $('#c-clear');
  if (b.dataset.armed){ custom = []; saveCustom(); renderCustom(); delete b.dataset.armed; b.textContent = '清空'; return; }
  b.dataset.armed = '1'; b.textContent = '確定清空？再按一次'; setTimeout(() => { delete b.dataset.armed; b.textContent = '清空'; }, 3000);
};
$('#c-play').onclick = () => {
  if (!custom.length){ toast('請先加入題目'); return; }
  settings.hint = $('#hintmode').value;
  questions = custom.map(p => makeProblem(p.type, p.given, p.unit, p.ctx, p.text)); startSet(); showTab('practice');
};
function encode(list){ return btoa(unescape(encodeURIComponent(JSON.stringify(list.map(({type, given, unit, ctx, text}) => [type, given, unit, ctx, text]))))); }
function decode(s){ return JSON.parse(decodeURIComponent(escape(atob(s.trim())))).filter(a => TYPES[a[0]] && a[1] > 0).map(a => makeProblem(a[0], a[1], a[2], a[3], a[4])); }
$('#c-copy').onclick = () => {
  if (!custom.length){ toast('請先加入題目'); return; }
  const code = encode(custom); $('#c-code').value = code;
  if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => toast('已複製題目代碼'), () => { $('#c-code').select(); toast('請按 Ctrl+C 複製'); });
  else { $('#c-code').select(); toast('請按 Ctrl+C 複製'); }
};
$('#c-import').onclick = () => {
  try {
    const list = decode($('#c-code').value);
    if (!list.length) throw 0;
    questions = list; startSet(); showTab('practice'); toast(`匯入 ${list.length} 題`);
  } catch(e){ toast('題目代碼看不懂，請確認有完整貼上'); }
};

/* ---------- tabs / misc ---------- */
function showTab(name){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name ? 'true' : 'false'));
  $('#view-practice').hidden = name !== 'practice';
  $('#view-setup').hidden = name !== 'setup';
  if (name === 'practice') renderPractice();
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
$('#dots').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i); });
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

renderTypeChecks(); renderCustom(); customPreview(); calc(); renderHist();
generate();
})();
</script>
</body>
</html>
